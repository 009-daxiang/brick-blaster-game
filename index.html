<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>蛇來了 · 枪火长蛇 100 关</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { width:100%; height:100%; overflow:hidden; background:#0f1226; overscroll-behavior:none;
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    user-select:none; -webkit-user-select:none; }
  #game { display:block; width:100%; height:100%; touch-action:none; }
  .overlay { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; background:radial-gradient(ellipse at center, rgba(15,18,38,.62), rgba(8,9,22,.88));
    backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
    transition: opacity .25s ease; z-index:10; text-align:center; padding:24px; }
  .overlay.hidden { opacity:0; pointer-events:none; }
  h1 { color:#fff; font-size:clamp(2.2rem, 8vw, 3.6rem); font-weight:900; letter-spacing:.06em;
    text-shadow:0 0 24px rgba(90,140,255,.55), 0 4px 0 rgba(0,0,0,.35); }
  h2 { color:#fff; font-size:clamp(1.6rem, 6vw, 2.4rem); font-weight:800; }
  .sub { color:rgba(255,255,255,.62); font-size:.95rem; letter-spacing:.12em; margin-top:-8px; }
  .hint { color:rgba(255,255,255,.42); font-size:.82rem; margin-top:10px; line-height:1.7; }
  button { border:none; cursor:pointer; font-family:inherit; font-weight:700; color:#fff;
    font-size:1.05rem; padding:13px 34px; border-radius:999px;
    background:linear-gradient(180deg,#4c6ef5,#364fc7);
    box-shadow:0 6px 18px rgba(58,80,220,.45), inset 0 1px 0 rgba(255,255,255,.25);
    transition:transform .12s ease, box-shadow .12s ease; }
  button:hover { transform:translateY(-2px); box-shadow:0 10px 24px rgba(58,80,220,.55), inset 0 1px 0 rgba(255,255,255,.25); }
  button:active { transform:translateY(1px) scale(.97); }
  button.ghost { background:rgba(255,255,255,.08); box-shadow:none; font-size:.92rem; padding:10px 26px; }
  .row { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }
  #starsBig { font-size:2.6rem; letter-spacing:.15em; color:#ffd43b; text-shadow:0 0 18px rgba(255,212,59,.5); }
  #starsBig .off { color:rgba(255,255,255,.18); text-shadow:none; }
  #clearStats, #overStats { color:rgba(255,255,255,.75); font-size:.95rem; line-height:1.8; }
  #clearStats b, #overStats b { color:#ffd43b; }
  #levelGrid { display:grid; grid-template-columns:repeat(auto-fill, minmax(50px, 1fr)); gap:8px;
    width:min(640px, 92vw); max-height:52vh; overflow-y:auto; padding:6px; }
  .lvBtn { width:auto; height:52px; border-radius:12px; font-size:1rem; padding:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
    background:rgba(255,255,255,.09); box-shadow:none; }
  .lvBtn .st { font-size:.6rem; color:#ffd43b; letter-spacing:0; }
  .lvBtn.locked { opacity:.28; cursor:not-allowed; }
  #recordBadge { display:inline-block; background:linear-gradient(90deg,#ffd43b,#ff922b); color:#5c3c00;
    font-size:.75rem; font-weight:800; padding:3px 12px; border-radius:999px; letter-spacing:.1em; }
  #upgradeCards { display:flex; flex-direction:column; gap:12px; width:min(400px, 88vw); }
  .upCard { position:relative; text-align:left; border:3px solid #4dabf7; background:rgba(20,24,50,.92);
    border-radius:14px; padding:12px 16px 12px 54px; box-shadow:0 6px 18px rgba(0,0,0,.4); }
  .upCard b { display:block; font-size:1.05rem; color:#fff; }
  .upCard i { display:block; font-style:normal; font-size:.8rem; color:rgba(255,255,255,.65); margin-top:2px; }
  .upCard .tier { position:absolute; left:14px; top:50%; transform:translateY(-50%);
    width:26px; height:26px; border-radius:8px; display:flex; align-items:center; justify-content:center;
    font-weight:900; color:#fff; font-size:.9rem; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="menuOv" class="overlay">
  <h1>蛇來了</h1>
  <p class="sub">枪火长蛇 · 炫彩子弹 · 100 关闯关</p>
  <button id="btnContinue">开始挑战</button>
  <button id="btnLevels" class="ghost">选 关</button>
  <button id="btnMute" class="ghost">🔊 音效：开</button>
  <p class="hint">小枪手自动开火，你只需左右移动走位 · 子弹打中蛇身即消除<br>长蛇一行一行压下来，碰到枪手位置就失败了<br>打碎蛇鳞掉炫彩技能：散射 / 火焰 / 穿透 / 追踪 / 速射 / 彩虹</p>
</div>

<div id="levelsOv" class="overlay hidden">
  <h2>选关（共 100 关）</h2>
  <div id="levelGrid"></div>
  <button id="btnBackMenu" class="ghost">返回</button>
</div>

<div id="clearOv" class="overlay hidden">
  <h2>过 关 ！</h2>
  <div id="starsBig"></div>
  <p id="clearStats"></p>
  <div class="row">
    <button id="btnNext">下一关</button>
    <button id="btnReplay" class="ghost">重玩本关</button>
    <button id="btnToLevels" class="ghost">选关</button>
  </div>
</div>

<div id="overOv" class="overlay hidden">
  <h2>长蛇入侵了…</h2>
  <p id="overStats"></p>
  <div class="row">
    <button id="btnRetry">再来一次</button>
    <button id="btnToLevels2" class="ghost">选关</button>
  </div>
</div>

<div id="upgradeOv" class="overlay hidden">
  <h2>✦ 选择强化 ✦</h2>
  <div id="upgradeCards"></div>
  <p class="hint">战场暂停中 · 选一张强化你的火力</p>
</div>

<div id="pauseOv" class="overlay hidden">
  <h2>已暂停</h2>
  <div class="row">
    <button id="btnResume">继续</button>
    <button id="btnQuit" class="ghost">回主菜单</button>
  </div>
</div>

<script>
'use strict';
/* ============================================================
   暴击砖块 · 枪火长蛇 100 关
   小枪手持续射击，子弹不反弹：打中蛇身造成伤害后消失
   长蛇加长加速并持续下压，压到枪手位置 = 失败
   炫彩子弹技能：散射 / 火焰 / 穿透 / 追踪 / 速射 / 彩虹
   单文件 / 零外部资源：Canvas 手绘 + WebAudio 合成音效
   ============================================================ */
const TAU = Math.PI * 2;
const MAX_LEVEL = 100;
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

/* ---------- 自适应 ---------- */
let W = 0, H = 0, DPR = 1;
let CELL = 46, BRICK_H = 22, GAP = 4, SEG_SPACING = 40;
let offX = 0, playW = 0, TOP = 90;
let gunnerY = 0, bgGrad = null;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  CELL = Math.min(W / 12, 46);
  playW = CELL * 12;
  offX = (W - playW) / 2;
  BRICK_H = Math.round(CELL * 0.46);
  GAP = Math.max(3, Math.round(CELL * 0.07));
  SEG_SPACING = Math.max(22, CELL * 0.9);
  TOP = Math.max(70, H * 0.1);
  gunnerY = H - 46;
  bgGrad = ctx.createLinearGradient(0, 0, 0, H);
  bgGrad.addColorStop(0, '#141a3a');
  bgGrad.addColorStop(0.55, '#101228');
  bgGrad.addColorStop(1, '#1a1030');
}
window.addEventListener('resize', resize);
resize();

/* ---------- 存档 ---------- */
const SAVE_KEY = 'brickBlaster.gunner.v1';
let progress = { unlocked: 1, stars: {} };
try {
  const raw = localStorage.getItem(SAVE_KEY);
  if (raw) { const p = JSON.parse(raw); if (p && p.unlocked) progress = p; }
} catch (e) {}
function saveProgress() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(progress)); } catch (e) {} }

/* ---------- 音效（WebAudio 合成） ---------- */
let AC = null, master = null, noiseBuf = null;
let muted = false;
try { muted = localStorage.getItem('brickBlaster.muted') === '1'; } catch (e) {}

function ensureAudio() {
  if (!AC) {
    const Ctor = window.AudioContext || window.webkitAudioContext;
    if (!Ctor) return;
    AC = new Ctor();
    master = AC.createGain(); master.gain.value = 0.42; master.connect(AC.destination);
    noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  if (AC.state === 'suspended') AC.resume();
}
function blip(freq, dur, type, vol, slideTo) {
  if (!AC || muted) return;
  const t = AC.currentTime;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'triangle';
  o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(slideTo, 1), t + dur);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.008);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t + dur + 0.02);
}
function noiseHit(dur, freq, vol, type) {
  if (!AC || muted) return;
  const t = AC.currentTime;
  const s = AC.createBufferSource(); s.buffer = noiseBuf;
  const f = AC.createBiquadFilter(); f.type = type || 'lowpass'; f.frequency.value = freq;
  const g = AC.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(f); f.connect(g); g.connect(master);
  s.start(t); s.stop(t + dur + 0.02);
}
const sfx = {
  shoot() { blip(760, 0.05, 'square', 0.05, 260); },
  hit(streak) { blip(320 * Math.pow(1.045, Math.min(streak, 26)), 0.05, 'square', 0.09); },
  pop(streak, hp) {
    noiseHit(0.1, 1600, 0.2);
    blip(460 * Math.pow(1.05, Math.min(streak, 20)), 0.09, 'triangle', 0.16, 180);
    if (hp >= 8) blip(140, 0.12, 'sine', 0.14, 60);
  },
  pickup() { blip(660, 0.09, 'triangle', 0.2); setTimeout(() => blip(990, 0.12, 'triangle', 0.2), 80); },
  fire() { noiseHit(0.4, 900, 0.22); blip(320, 0.25, 'sawtooth', 0.12, 90); },
  laser() { blip(1200, 0.06, 'sawtooth', 0.1, 500); },
  thunder() { noiseHit(0.15, 2400, 0.25, 'highpass'); blip(180, 0.18, 'sawtooth', 0.16, 60); },
  meteor() { noiseHit(0.3, 700, 0.3); blip(120, 0.3, 'sine', 0.2, 40); },
  rainbow() { [523, 659, 784].forEach((f, i) => setTimeout(() => blip(f, 0.08, 'square', 0.1), i * 50)); },
  fail() { blip(220, 0.55, 'sawtooth', 0.22, 70); noiseHit(0.4, 500, 0.25); },
  clear() { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => blip(f, 0.22, 'triangle', 0.22), i * 95)); }
};
function buzz(ms) { if (navigator.vibrate) try { navigator.vibrate(ms); } catch (e) {} }

/* ---------- 关卡参数（种子随机，100 关） ---------- */
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function genLevel(n) {
  return {
    len: Math.min(28 + Math.round(n * 1.3), 80),          // 蛇更长，一行行盘下来
    hpBase: 1 + Math.floor((n - 1) / 14),                  // 基础血量 1→8
    snakeSpeed: Math.min(80 + n * 2.2, 280)                // 一行行横走，碰壁下一行
  };
}

/* ---------- 游戏状态 ---------- */
const S_MENU = 'menu', S_PLAY = 'play', S_CLEAR = 'clear', S_OVER = 'over';
let state = S_MENU;
let level = 1, levelData = null;
let bricks = [];                          // 蛇身鳞片
let head = { x: 0, y: 0 };
let rowDir = 1, rowY = 0, descent = 0;
let bullets = [], powerups = [], bolts = [];
let particles = [], popups = [];
let score = 0, shatterCount = 0, streak = 0, streakT = 0;
let introT = 1;
let timeScale = 1, slowmoT = 0, shake = 0, flash = 0, flashColor = '255,255,255';
let paused = false, overT = 0;
let gunnerX = 0, gunnerTarget = 0, muzzleT = 0, walkT = 0;
let firing = false, fireCd = 0;
// 炫彩子弹技能
let spreadT = 0, fireT = 0, pierceT = 0, homingT = 0, rapidT = 0, rainbowT = 0;
let bulletSpeedMul = 1;
let keys = { left: false, right: false };
let minGap = 0, initialGap = 1;
// 三选一强化（参考打了个龙）：属性 + 副武器
let upgradeOpen = false, upgradeCards = [];
let dmgMul = 1, rateMul = 1, extraBullets = 0, critChance = 0, pierceExtra = 0, thunderWeapon = false;
let totalHp0 = 1;

function baseSpeed() { return 820 * bulletSpeedMul; }
function fireInterval() { return (rapidT > 0 ? 0.075 : 0.17) / rateMul; }
function bandTop() { return TOP + 24 + descent; }
function bandBottom() { return TOP + 24 + Math.min(230, H * 0.32) + descent; }

/* ---------- 关卡流程 ---------- */
function buildSnake() {
  const rnd = mulberry32(level * 2654435 + 17);
  const n = levelData.len;
  bricks = [];
  const rowStep = BRICK_H + GAP;
  rowY = TOP + 40;
  rowDir = rnd() < 0.5 ? 1 : -1;
  descent = 0;
  head = { x: rowDir > 0 ? offX + 30 : offX + playW - 30, y: rowY };
  // 初始按蛇形折行铺开，与行进方式一致
  let x = head.x, y = rowY, dir = -rowDir;
  for (let i = 0; i < n; i++) {
    const hp = Math.max(1, Math.min(30,
      levelData.hpBase + Math.floor(i / 10) + (rnd() < 0.25 ? 1 : 0)));
    bricks.push({ x, y, ang: dir > 0 ? 0 : Math.PI, hp, maxHp: hp, flash: 0, punch: 0, cd: 0 });
    x += dir * SEG_SPACING;
    if (x < offX + 26 || x > offX + playW - 26) {
      x = Math.max(offX + 26, Math.min(offX + playW - 26, x));
      y += rowStep;
      dir = -dir;
    }
  }
  // 初始压境余量
  initialGap = Math.max(1, gunnerY - lowestBottom());
  minGap = initialGap;
}
function lowestBottom() {
  let m = 0;
  for (const s of bricks) m = Math.max(m, s.y + BRICK_H / 2);
  return m;
}
function startLevel(n) {
  level = Math.min(n, MAX_LEVEL);
  levelData = genLevel(level);
  gunnerX = W / 2; gunnerTarget = W / 2;
  buildSnake();
  bullets = []; powerups = []; bolts = [];
  particles = []; popups = [];
  score = 0; shatterCount = 0; streak = 0; streakT = 0;
  dmgMul = 1; rateMul = 1; extraBullets = 0; critChance = 0; pierceExtra = 0; thunderWeapon = false;
  upgradeOpen = false; upgradeCards = [];
  totalHp0 = Math.max(1, bricks.reduce((a, b) => a + b.hp, 0));
  spreadT = 0; fireT = 0; pierceT = 0; homingT = 0; rapidT = 0; rainbowT = 0;
  bulletSpeedMul = 1;
  firing = false; fireCd = 0;
  slowmoT = 0; shake = 0; flash = 0; overT = 0;
  introT = 0;
  paused = false;
  state = S_PLAY;
  hideAll();
}
function doFail() {
  state = S_OVER;
  overT = 0;
  firing = false;
  shake = 16; flash = 0.35; flashColor = '255,70,70';
  sfx.fail(); buzz(180);
}
function doClear() {
  state = S_CLEAR;
  overT = 0;
  slowmoT = 0.55;
  score += 300;
  sfx.clear(); buzz(60);
  const ratio = minGap / initialGap;
  let stars = 1;
  if (ratio >= 0.5) stars = 3; else if (ratio >= 0.25) stars = 2;
  const isNew = !(level in progress.stars) || progress.stars[level] < stars;
  progress.stars[level] = Math.max(progress.stars[level] || 0, stars);
  if (level < MAX_LEVEL) progress.unlocked = Math.max(progress.unlocked, level + 1);
  saveProgress();
  const cols = ['#ff6b6b', '#ffd43b', '#69db7c', '#4dabf7', '#da77f2', '#ffa94d'];
  for (let i = 0; i < 70; i++) {
    particles.push({
      type: 'confetti',
      x: W / 2 + (Math.random() * 2 - 1) * 60, y: H * 0.42,
      vx: (Math.random() * 2 - 1) * 420, vy: -Math.random() * 520 - 120,
      w: 5 + Math.random() * 6, h: 3 + Math.random() * 4,
      rot: Math.random() * TAU, vr: (Math.random() * 2 - 1) * 12,
      color: cols[i % cols.length], life: 1.4 + Math.random() * 0.6, age: 0, grav: 780
    });
  }
  setTimeout(() => {
    if (state !== S_CLEAR) return;
    document.getElementById('starsBig').innerHTML =
      '★★★'.slice(0, stars) + '<span class="off">' + '★★★'.slice(stars) + '</span>';
    const finale = level === MAX_LEVEL ? '<span id="recordBadge">🏆 100 关全部通关！！</span><br>' : '';
    document.getElementById('clearStats').innerHTML =
      finale + (isNew ? '<span id="recordBadge">新纪录！</span><br>' : '') +
      '第 <b>' + level + '</b> 关 · 剩余安全距离 <b>' + Math.round(minGap) + '</b>px<br>得分 <b>' + score + '</b>';
    show('clearOv');
  }, 950);
}

/* ---------- 特效基元 ---------- */
function addShards(x, y, color, n, power) {
  for (let i = 0; i < n; i++) {
    particles.push({
      type: 'shard', x, y,
      vx: (Math.random() * 2 - 1) * 240 * power, vy: -Math.random() * 260 * power - 40,
      w: 4 + Math.random() * 8, h: 3 + Math.random() * 6,
      rot: Math.random() * TAU, vr: (Math.random() * 2 - 1) * 10,
      color, life: 0.7 + Math.random() * 0.4, age: 0, grav: 900
    });
  }
}
function addSparks(x, y, n, color, power) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * TAU, sp = (60 + Math.random() * 200) * power;
    particles.push({
      type: 'spark', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      w: 1.5 + Math.random() * 2.5, h: 0, rot: 0, vr: 0,
      color, life: 0.3 + Math.random() * 0.3, age: 0, grav: 200
    });
  }
}
function addPopup(x, y, text, color, size) {
  popups.push({ x, y, text, color, size: size || 18, age: 0, life: 0.75, vy: -72 });
}
function addBolt(x1, y1, x2, y2) {
  const pts = [{ x: x1, y: y1 }];
  for (let i = 1; i < 5; i++) {
    const k = i / 5;
    pts.push({ x: x1 + (x2 - x1) * k + (Math.random() * 2 - 1) * 14, y: y1 + (y2 - y1) * k + (Math.random() * 2 - 1) * 14 });
  }
  pts.push({ x: x2, y: y2 });
  bolts.push({ pts, life: 0.18, age: 0 });
}

/* ---------- 蛇鳞伤害 / 碎裂 / 掉技能 ---------- */
function tierColor(hp) {
  if (hp >= 20) return ['#e03131', '#7a1717'];
  if (hp >= 12) return ['#f76707', '#8f3b00'];
  if (hp >= 7)  return ['#f59f00', '#8a5c00'];
  if (hp >= 4)  return ['#37b24d', '#1d6630'];
  if (hp >= 2)  return ['#15aabf', '#0a5460'];
  return ['#4c6ef5', '#22347f'];
}
function damageSegment(s, dmg, chain) {
  if (s.hp <= 0) return;
  s.hp -= dmg;
  s.flash = 1; s.punch = 1;
  // 雷电之芽副武器：命中概率触发落雷
  if (thunderWeapon && !chain && Math.random() < 0.3) {
    const near = bricks
      .filter(o => o !== s && o.hp > 0)
      .map(o => ({ o, d: (o.x - s.x) ** 2 + (o.y - s.y) ** 2 }))
      .sort((a, b) => a.d - b.d)[0];
    if (near && near.d < 150 * 150) {
      addBolt(s.x, s.y, near.o.x, near.o.y);
      damageSegment(near.o, 1, true);
      sfx.thunder();
    }
  }
  if (s.hp <= 0) {
    shatterSegment(s, chain);
  } else {
    score += 1;
    addSparks(s.x, s.y, 3, 'rgba(255,255,255,0.9)', 0.8);
    shake = Math.min(shake + 0.3, 4);
    sfx.hit(streak);
  }
}
function shatterSegment(s, chain) {
  const col = tierColor(s.maxHp);
  addShards(s.x, s.y, col[0], 5 + Math.min(Math.floor(s.maxHp / 3), 5), 0.7 + Math.min(s.maxHp * 0.06, 0.8));
  addSparks(s.x, s.y, 6, 'rgba(255,255,255,0.85)', 1);
  shake = Math.min(shake + 1 + s.maxHp * 0.18, 13);
  score += s.maxHp * 5;
  addPopup(s.x, s.y, '+' + (s.maxHp * 5), '#fff', 15 + Math.min(s.maxHp, 14));
  streak++; streakT = 1.1;
  if (streak >= 4) addPopup(s.x, s.y - 26, '连击 ×' + streak, '#ffd43b', 17);
  sfx.pop(streak, s.maxHp);
  buzz(8);
  const i = bricks.indexOf(s);
  if (i >= 0) bricks.splice(i, 1);
  shatterCount++;
  if (shatterCount % 10 === 0 && !upgradeOpen && state === S_PLAY) openUpgrade();
  if (shatterCount % 7 === 0 || Math.random() < 0.08) dropPowerup(s.x, s.y);
  if (bricks.length === 0 && state === S_PLAY) doClear();
}

/* ---------- 炫彩技能 ---------- */
const POWER_TYPES = {
  spread:  { label: '散', color: '#69db7c', name: '三向散射！' },
  fire:    { label: '火', color: '#ff922b', name: '火焰弹！' },
  pierce:  { label: '穿', color: '#da77f2', name: '穿透弹！' },
  homing:  { label: '追', color: '#faa2c1', name: '追踪弹！' },
  rapid:   { label: '速', color: '#4dabf7', name: '速射模式！' },
  rainbow: { label: '彩', color: '#ffd43b', name: '彩虹弹！' }
};
const POWER_KEYS = Object.keys(POWER_TYPES);
function dropPowerup(x, y) {
  const type = POWER_KEYS[Math.floor(Math.random() * POWER_KEYS.length)];
  powerups.push({ x, y, vy: 170, type, rot: 0 });
}
function giveBuff(type) {
  if (type === 'spread') spreadT = 8;
  else if (type === 'fire') fireT = 8;
  else if (type === 'pierce') pierceT = 8;
  else if (type === 'homing') homingT = 8;
  else if (type === 'rapid') rapidT = 8;
  else if (type === 'rainbow') rainbowT = 8;
  flash = Math.max(flash, 0.1); flashColor = '220,200,255';
}
function catchPowerup(p) {
  const def = POWER_TYPES[p.type];
  score += 50;
  addPopup(gunnerX, gunnerY - 46, def.name, def.color, 19);
  addSparks(p.x, p.y, 10, def.color, 1.2);
  giveBuff(p.type);
  if (p.type === 'fire') sfx.fire();
  else if (p.type === 'rainbow') sfx.rainbow();
  else sfx.pickup();
  buzz(20);
}

/* ---------- 输入（桌面鼠标 + 触屏增量拖动统一处理） ---------- */
let touchAnchorX = null, gunnerAnchor = null;
function clampTarget(x) { return Math.max(offX + 14, Math.min(offX + playW - 14, x)); }
canvas.addEventListener('pointerdown', e => {
  ensureAudio();
  if (state !== S_PLAY || paused) return;
  if (e.pointerType === 'touch') {
    touchAnchorX = e.clientX;
    gunnerAnchor = gunnerTarget;
  } else {
    gunnerTarget = clampTarget(e.clientX);
  }
});
window.addEventListener('pointermove', e => {
  if (state !== S_PLAY || paused) return;
  if (e.pointerType === 'touch') {
    if (touchAnchorX !== null) gunnerTarget = clampTarget(gunnerAnchor + (e.clientX - touchAnchorX) * 1.2);
  } else {
    gunnerTarget = clampTarget(e.clientX);
  }
});
function releasePointer(e) { if (e.pointerType === 'touch') touchAnchorX = null; }
window.addEventListener('pointerup', releasePointer);
window.addEventListener('pointercancel', releasePointer);
canvas.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') { keys.left = true; e.preventDefault(); }
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') { keys.right = true; e.preventDefault(); }
  if (e.key === 'Escape' && (state === S_PLAY)) {
    paused = !paused;
    if (paused) show('pauseOv'); else hideAll();
  }
});
window.addEventListener('keyup', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
});

/* ---------- 子弹 ---------- */
function spawnBullet(spreadIdx, total) {
  const ang = total > 1 ? -0.24 + (0.48 * spreadIdx) / (total - 1) : (Math.random() * 0.06 - 0.03);
  const hue = rainbowT > 0 ? (performance.now() / 4 + spreadIdx * 60) % 360 : null;
  let color = '#9ecfff';
  if (fireT > 0) color = '#ff922b';
  else if (pierceT > 0) color = '#da77f2';
  else if (homingT > 0) color = '#faa2c1';
  else if (rapidT > 0) color = '#4dabf7';
  if (hue !== null) color = 'hsl(' + hue + ',95%,65%)';
  let dmg = rainbowT > 0 ? 1 + Math.floor(Math.random() * 3) : 1;
  dmg = Math.max(1, Math.round(dmg * dmgMul));
  let crit = false;
  if (Math.random() < critChance) { dmg *= 2; crit = true; color = '#ffd43b'; }
  bullets.push({
    x: gunnerX + (total > 1 ? (spreadIdx - (total - 1) / 2) * 8 : 0),
    y: gunnerY - 40,
    vx: Math.sin(ang) * baseSpeed(),
    vy: -Math.cos(ang) * baseSpeed(),
    dmg, color, hue, crit,
    pierce: 1 + pierceExtra + (pierceT > 0 ? 2 : 0)
  });
}
function fireOnce() {
  const n = (spreadT > 0 ? 3 : 1) + extraBullets;
  for (let i = 0; i < n; i++) spawnBullet(i, n);
  muzzleT = 0.06;
  sfx.shoot();
}
/* 子弹 vs 旋转鳞片（OBB） */
function bulletHitSegment(b, s) {
  const dx = b.x - s.x, dy = b.y - s.y;
  const broad = BRICK_H * 1.5 + 8;
  if (dx * dx + dy * dy > broad * broad) return false;
  const ca = Math.cos(-s.ang), sa = Math.sin(-s.ang);
  const lx = dx * ca - dy * sa, ly = dx * sa + dy * ca;
  const hw = (CELL - GAP) / 2, hh = BRICK_H / 2;
  const cx = Math.max(-hw, Math.min(lx, hw));
  const cy = Math.max(-hh, Math.min(ly, hh));
  const ddx = lx - cx, ddy = ly - cy;
  return ddx * ddx + ddy * ddy <= 49;   // 子弹半径≈7
}
function bulletImpact(b) {
  if (fireT > 0) {
    // 火焰溅射
    for (const s of bricks) {
      const dx = s.x - b.x, dy = s.y - b.y;
      if (dx * dx + dy * dy < 64 * 64) damageSegment(s, 1, true);
    }
    addSparks(b.x, b.y, 6, '#ff922b', 1.1);
    if (Math.random() < 0.4) noiseHit(0.08, 800, 0.08);
  } else {
    addSparks(b.x, b.y, 3, b.color, 0.8);
  }
}

/* ---------- 更新 ---------- */
function update(rdt) {
  if (upgradeOpen) return;   // 三选一强化时战场暂停
  if (slowmoT > 0) slowmoT -= rdt;
  timeScale += ((slowmoT > 0 ? 0.3 : 1) - timeScale) * Math.min(1, rdt * 10);
  const dt = rdt * timeScale;

  introT = Math.min(1, introT + rdt * 2);
  if (spreadT > 0) spreadT -= rdt;
  if (fireT > 0) fireT -= rdt;
  if (pierceT > 0) pierceT -= rdt;
  if (homingT > 0) homingT -= rdt;
  if (rapidT > 0) rapidT -= rdt;
  if (rainbowT > 0) rainbowT -= rdt;

  // 长蛇：一行一行横走，碰壁折返下移一行
  if (state === S_PLAY && introT >= 0.3) {
    const rowStep = BRICK_H + GAP;
    head.x += rowDir * levelData.snakeSpeed * dt;
    head.y = rowY + Math.sin(head.x * 0.03 + level) * 4;
    const bx0 = offX + 26, bx1 = offX + playW - 26;
    if (head.x > bx1) { head.x = bx1; rowDir = -1; rowY += rowStep; descent += rowStep; }
    else if (head.x < bx0) { head.x = bx0; rowDir = 1; rowY += rowStep; descent += rowStep; }
    for (let i = 0; i < bricks.length; i++) {
      const s = bricks[i];
      const px = i === 0 ? head.x : bricks[i - 1].x;
      const py = i === 0 ? head.y : bricks[i - 1].y;
      let dx = px - s.x, dy = py - s.y;
      let d = Math.hypot(dx, dy);
      if (d < 0.001) { dx = 1; dy = 0; d = 1; }
      s.x += dx / d * (d - SEG_SPACING);
      s.y += dy / d * (d - SEG_SPACING);
      s.ang = Math.atan2(dy, dx);
      s.cd = Math.max(0, s.cd - dt);
    }
    // 压到枪手位置 = 失败
    if (state === S_PLAY && lowestBottom() >= gunnerY - 12) doFail();
    // 星级：跟踪最小安全距离
    minGap = Math.min(minGap, Math.max(0, gunnerY - lowestBottom()));
  }

  // 枪手
  const gw = 26;
  if (keys.left) gunnerTarget -= W * 1.1 * rdt;
  if (keys.right) gunnerTarget += W * 1.1 * rdt;
  gunnerTarget = clampTarget(gunnerTarget);
  const prevX = gunnerX;
  gunnerX += (gunnerTarget - gunnerX) * Math.min(1, rdt * 16);
  walkT += Math.abs(gunnerX - prevX) * 0.08;
  muzzleT = Math.max(0, muzzleT - rdt);

  // 射击
  firing = state === S_PLAY && !paused && introT >= 1;   // 自动射击
  if (firing) {
    fireCd -= rdt;
    if (fireCd <= 0) { fireCd = fireInterval(); fireOnce(); }
  } else fireCd = Math.min(fireCd, 0.05);

  // 子弹（3 段子步推进，杜绝高速穿身）
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    // 追踪：缓慢转向最近蛇鳞
    if (homingT > 0 && bricks.length) {
      let best = null, bd = 420 * 420;
      for (const s of bricks) {
        const dx = s.x - b.x, dy = s.y - b.y;
        const d2 = dx * dx + dy * dy;
        if (d2 < bd) { bd = d2; best = s; }
      }
      if (best) {
        const want = Math.atan2(best.y - b.y, best.x - b.x);
        let cur = Math.atan2(b.vy, b.vx);
        let diff = want - cur;
        while (diff > Math.PI) diff -= TAU;
        while (diff < -Math.PI) diff += TAU;
        const turn = Math.max(-4.2 * dt, Math.min(4.2 * dt, diff));
        cur += turn;
        const sp = Math.hypot(b.vx, b.vy);
        b.vx = Math.cos(cur) * sp; b.vy = Math.sin(cur) * sp;
      }
    }
    let dead = false;
    const steps = 3;
    for (let st = 0; st < steps && !dead; st++) {
      b.x += b.vx * dt / steps;
      b.y += b.vy * dt / steps;
      if (b.y < -20) { dead = true; break; }
      for (let k = bricks.length - 1; k >= 0; k--) {
        const s = bricks[k];
        if (s.cd > 0) continue;
        if (bulletHitSegment(b, s)) {
          if (b.pierce > 0) { b.pierce--; s.cd = 0.15; }
          else dead = true;
          damageSegment(s, b.dmg, false);
          bulletImpact(b);
          break;
        }
      }
    }
    if (Math.random() < 0.4) {
      particles.push({ type: 'spark', x: b.x, y: b.y, vx: 0, vy: 0, w: 1.8, h: 0, rot: 0, vr: 0, color: b.color, life: 0.18, age: 0, grav: 0 });
    }
    if (dead || b.x < offX - 20 || b.x > offX + playW + 20) bullets.splice(i, 1);
  }
  for (const s of bricks) s.cd = Math.max(0, s.cd - dt);

  // 技能胶囊
  for (let i = powerups.length - 1; i >= 0; i--) {
    const p = powerups[i];
    p.y += 170 * dt; p.rot = Math.sin(p.y * 0.05) * 0.2;
    if (p.y > gunnerY - 26 && p.y < gunnerY + 30 && Math.abs(p.x - gunnerX) < 30) {
      catchPowerup(p); powerups.splice(i, 1); continue;
    }
    if (p.y > H + 30) powerups.splice(i, 1);
  }
  // 闪电视觉
  for (let i = bolts.length - 1; i >= 0; i--) {
    bolts[i].age += rdt;
    if (bolts[i].age >= bolts[i].life) bolts.splice(i, 1);
  }
  // 火焰弹枪口余焰
  if (fireT > 0 && Math.random() < 0.3) {
    particles.push({ type: 'spark', x: gunnerX + (Math.random() * 20 - 10), y: gunnerY - 34, vx: 0, vy: -60, w: 2.5, h: 0, rot: 0, vr: 0, color: '#ff922b', life: 0.25, age: 0, grav: 0 });
  }

  // 特效
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.age += rdt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vy += (p.grav || 0) * dt;
    p.rot += p.vr * dt;
    if (p.type === 'confetti') p.vx *= (1 - 0.8 * dt);
    if (p.age >= p.life) particles.splice(i, 1);
  }
  for (let i = popups.length - 1; i >= 0; i--) {
    const p = popups[i];
    p.age += rdt; p.y += p.vy * rdt;
    if (p.age >= p.life) popups.splice(i, 1);
  }
  for (const b of bricks) {
    b.flash = Math.max(0, b.flash - rdt * 6);
    b.punch = Math.max(0, b.punch - rdt * 7);
  }
  streakT -= rdt;
  if (streakT <= 0) streak = 0;

  if (state === S_OVER) {
    overT += rdt;
    if (overT > 1.05 && document.getElementById('overOv').classList.contains('hidden')) {
      document.getElementById('overStats').innerHTML =
        '第 <b>' + level + '</b> 关 · 得分 <b>' + score + '</b><br>长蛇压到枪手位置了，火力再猛一点！';
      show('overOv');
    }
  }
  if (state === S_CLEAR) overT += rdt;

  shake = Math.max(0, shake - shake * 7 * rdt - 6 * rdt);
  flash = Math.max(0, flash - rdt * 2.2);
}

/* ---------- 渲染 ---------- */
function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);
  ctx.save();
  if (shake > 0.2) ctx.translate((Math.random() * 2 - 1) * shake, (Math.random() * 2 - 1) * shake);
  ctx.globalAlpha = introT;
  drawRails();
  drawDangerGauge();
  drawSnakeBody();
  drawBricks();
  drawPowerups();
  drawBullets();
  drawBolts();
  drawParticles();
  drawGunner();
  drawPopups();
  drawHUD();
  drawBossBar();
  ctx.globalAlpha = 1;
  ctx.restore();
  if (flash > 0.01) {
    ctx.fillStyle = 'rgba(' + flashColor + ',' + Math.min(flash, 0.6) + ')';
    ctx.fillRect(0, 0, W, H);
  }
}
function drawRails() {
  ctx.fillStyle = 'rgba(255,255,255,0.045)';
  ctx.fillRect(offX - 6, 0, 6, H);
  ctx.fillRect(offX + playW, 0, 6, H);
}
/* 压境进度条：右缘竖条，蛇越近越红 */
function drawDangerGauge() {
  if (state === S_MENU) return;
  const ratio = Math.max(0, Math.min(1, (gunnerY - lowestBottom()) / Math.max(initialGap, 1)));
  const x = offX + playW + 14, h = H - 120, y0 = 60;
  ctx.fillStyle = 'rgba(255,255,255,0.08)';
  roundRect(x, y0, 6, h, 3); ctx.fill();
  const c = ratio > 0.5 ? '#69db7c' : ratio > 0.25 ? '#ffd43b' : '#ff6b6b';
  ctx.fillStyle = c;
  const hh = h * (1 - ratio);
  roundRect(x, y0 + h - hh, 6, hh, 3); ctx.fill();
  const t = performance.now() / 1000;
  if (ratio < 0.3) {
    ctx.globalAlpha = 0.5 + 0.4 * Math.sin(t * 9);
    ctx.fillStyle = 'rgba(255,60,60,0.15)';
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
  }
}
function drawSnakeBody() {
  if (bricks.length < 2) return;
  ctx.save();
  ctx.strokeStyle = 'rgba(60,70,130,0.55)';
  ctx.lineWidth = BRICK_H * 0.92;
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(bricks[0].x, bricks[0].y);
  for (let i = 1; i < bricks.length; i++) ctx.lineTo(bricks[i].x, bricks[i].y);
  ctx.stroke();
  ctx.restore();
}
function drawBricks() {
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const t = performance.now() / 1000;
  for (let i = 0; i < bricks.length; i++) {
    const b = bricks[i];
    const col = tierColor(b.hp);
    const punch = 1 + b.punch * 0.08;
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.rotate(b.ang);
    ctx.scale(punch, punch);
    const w = CELL - GAP, h = BRICK_H;
    ctx.fillStyle = col[1];
    roundRect(-w / 2, -h / 2 + 2, w, h, h * 0.4); ctx.fill();
    const g = ctx.createLinearGradient(0, -h / 2, 0, h / 2);
    g.addColorStop(0, col[0]);
    g.addColorStop(1, shade(col[0], -0.18));
    ctx.fillStyle = g;
    roundRect(-w / 2, -h / 2, w, h - 2, h * 0.4); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.22)';
    roundRect(-w / 2 + 2, -h / 2 + 1, w - 4, h * 0.34, h * 0.2); ctx.fill();
    if (b.flash > 0) {
      ctx.fillStyle = 'rgba(255,255,255,' + (b.flash * 0.75) + ')';
      roundRect(-w / 2, -h / 2, w, h - 2, h * 0.4); ctx.fill();
    }
    if (i === 0) {
      ctx.shadowColor = 'rgba(255,255,255,0.8)';
      ctx.shadowBlur = 8 + 5 * Math.sin(t * 6);
      ctx.fillStyle = 'rgba(255,255,255,0.95)';
      ctx.beginPath();
      ctx.arc(-w * 0.18, -h * 0.3, 1.9, 0, TAU);
      ctx.arc(w * 0.18, -h * 0.3, 1.9, 0, TAU);
      ctx.fill();
      ctx.shadowBlur = 0;
    }
    ctx.fillStyle = '#fff';
    const fs = Math.round(h * 0.6 * (1 + b.punch * 0.35));
    ctx.font = '800 ' + fs + 'px system-ui, "PingFang SC", sans-serif';
    ctx.shadowColor = 'rgba(0,0,0,0.4)'; ctx.shadowBlur = 3; ctx.shadowOffsetY = 1;
    ctx.fillText(String(b.hp), 0, -1);
    ctx.restore();
  }
  ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
}
function drawPowerups() {
  const t = performance.now() / 1000;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const p of powerups) {
    const def = POWER_TYPES[p.type];
    const w = CELL * 0.72, h = CELL * 0.38;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(Math.sin(t * 4 + p.x) * 0.16);
    ctx.shadowColor = def.color; ctx.shadowBlur = 10;
    ctx.fillStyle = def.color;
    roundRect(-w / 2, -h / 2, w, h, h / 2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    roundRect(-w / 2 + 2, -h / 2 + 2, w - 4, h * 0.4, h / 3); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = '900 ' + Math.round(h * 0.62) + 'px system-ui, "PingFang SC", sans-serif';
    ctx.fillText(def.label, 0, 0);
    ctx.restore();
  }
}
function drawBullets() {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const b of bullets) {
    ctx.fillStyle = b.color;
    ctx.globalAlpha = 0.5;
    ctx.beginPath(); ctx.arc(b.x, b.y, 7, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.beginPath(); ctx.arc(b.x, b.y, 3.2, 0, TAU); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(b.x, b.y, 1.6, 0, TAU); ctx.fill();
  }
  ctx.restore();
}
function drawBolts() {
  if (!bolts.length) return;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const b of bolts) {
    const a = 1 - b.age / b.life;
    ctx.strokeStyle = 'rgba(255,240,150,' + a + ')';
    ctx.lineWidth = 3;
    ctx.shadowColor = 'rgba(255,240,150,0.9)';
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.moveTo(b.pts[0].x, b.pts[0].y);
    for (let i = 1; i < b.pts.length; i++) ctx.lineTo(b.pts[i].x, b.pts[i].y);
    ctx.stroke();
  }
  ctx.restore();
  ctx.shadowBlur = 0;
}
function drawGunner() {
  if (state === S_MENU) return;
  const t = performance.now() / 1000;
  const bob = Math.sin(walkT) * 1.5;
  ctx.save();
  ctx.translate(gunnerX, gunnerY + bob);
  // 枪管
  ctx.fillStyle = '#dee2e6';
  roundRect(-2.5, -34, 5, 16, 2.5); ctx.fill();
  if (muzzleT > 0) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const fg = ctx.createRadialGradient(0, -38, 1, 0, -38, 14);
    fg.addColorStop(0, 'rgba(255,255,220,0.95)');
    fg.addColorStop(1, 'rgba(255,180,80,0)');
    ctx.fillStyle = fg;
    ctx.beginPath(); ctx.arc(0, -38, 14, 0, TAU); ctx.fill();
    ctx.restore();
  }
  // 身体
  const g = ctx.createLinearGradient(0, -18, 0, 4);
  g.addColorStop(0, fireT > 0 ? '#ff922b' : spreadT > 0 ? '#69db7c' : '#4c6ef5');
  g.addColorStop(1, '#364fc7');
  ctx.fillStyle = g;
  roundRect(-9, -18, 18, 22, 7); ctx.fill();
  // 头盔 + 脸
  ctx.fillStyle = '#ffd8a8';
  ctx.beginPath(); ctx.arc(0, -23, 6, 0, TAU); ctx.fill();
  ctx.fillStyle = '#4c6ef5';
  ctx.beginPath(); ctx.arc(0, -24, 6.2, Math.PI, TAU); ctx.fill();
  ctx.fillStyle = '#222';
  ctx.beginPath(); ctx.arc(-2, -23, 1, 0, TAU); ctx.arc(2, -23, 1, 0, TAU); ctx.fill();
  // 脚
  ctx.fillStyle = '#22347f';
  const legOff = Math.sin(walkT) * 2.5;
  roundRect(-8 + legOff, 4, 6, 5, 2.5); ctx.fill();
  roundRect(2 - legOff, 4, 6, 5, 2.5); ctx.fill();
  ctx.restore();
  // 技能状态
  const tags = [];
  if (spreadT > 0) tags.push('🟢 散射 ' + Math.ceil(spreadT) + 's');
  if (fireT > 0) tags.push('🔥 火焰 ' + Math.ceil(fireT) + 's');
  if (pierceT > 0) tags.push('🟣 穿透 ' + Math.ceil(pierceT) + 's');
  if (homingT > 0) tags.push('💗 追踪 ' + Math.ceil(homingT) + 's');
  if (rapidT > 0) tags.push('⚡ 速射 ' + Math.ceil(rapidT) + 's');
  if (rainbowT > 0) tags.push('🌈 彩虹 ' + Math.ceil(rainbowT) + 's');
  if (tags.length) {
    ctx.fillStyle = 'rgba(255,255,255,0.65)';
    ctx.font = '600 12px system-ui, "PingFang SC", sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText(tags.join(' · '), W - 16, H - 12);
  }
  if (state === S_PLAY && introT >= 1 && score === 0) {
    const a = 0.4 + 0.25 * Math.sin(t * 4);
    ctx.fillStyle = 'rgba(255,255,255,' + a + ')';
    ctx.font = '600 14px system-ui, "PingFang SC", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('自动开火中 · 左右移动走位躲避长蛇', gunnerX, gunnerY - 56);
  }
}
function drawParticles() {
  for (const p of particles) {
    const a = Math.max(0, 1 - p.age / p.life);
    if (p.type === 'spark') {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = a;
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.w, 0, TAU); ctx.fill();
      ctx.restore();
    } else {
      ctx.save();
      ctx.globalAlpha = a;
      ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    }
  }
  ctx.globalAlpha = 1;
}
function drawPopups() {
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const p of popups) {
    const a = 1 - p.age / p.life;
    const punch = 1 + 0.5 * Math.max(0, 1 - p.age * 7);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.translate(p.x, p.y);
    ctx.scale(punch, punch);
    ctx.fillStyle = p.color;
    ctx.font = '800 ' + p.size + 'px system-ui, "PingFang SC", sans-serif';
    ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 6;
    ctx.fillText(p.text, 0, 0);
    ctx.restore();
  }
  ctx.globalAlpha = 1; ctx.shadowBlur = 0;
}
function drawHUD() {
  if (state === S_MENU) return;
  ctx.save();
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.font = '600 13px system-ui, "PingFang SC", sans-serif';
  ctx.fillText('得分', 18, 22);
  ctx.fillStyle = '#fff';
  ctx.font = '900 26px system-ui, "PingFang SC", sans-serif';
  ctx.fillText(String(score), 18, 48);
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.font = '600 13px system-ui, "PingFang SC", sans-serif';
  ctx.fillText('第 ' + level + ' 关 · 蛇鳞 ×' + bricks.length, W / 2, 22);
  ctx.restore();
}
function drawBossBar() {
  if (state === S_MENU || !bricks.length || !levelData) return;
  const cur = bricks.reduce((a, b) => a + b.hp, 0);
  const ratio = Math.max(0, Math.min(1, cur / Math.max(totalHp0, 1)));
  const w = Math.min(340, playW * 0.66), x = W / 2 - w / 2, y = 36;
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  roundRect(x - 2, y - 2, w + 4, 13, 7); ctx.fill();
  ctx.fillStyle = '#5c1717';
  roundRect(x, y, w, 9, 4.5); ctx.fill();
  ctx.fillStyle = '#e03131';
  roundRect(x, y, w * ratio, 9, 4.5); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.92)';
  ctx.font = '700 10px system-ui, "PingFang SC", sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('🐉 恶龙 · 第 ' + level + ' 章', W / 2, y + 4.5);
}
function roundRect(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const r = Math.max(0, Math.min(255, Math.round(((n >> 16) & 255) * (1 + amt))));
  const g = Math.max(0, Math.min(255, Math.round(((n >> 8) & 255) * (1 + amt))));
  const b = Math.max(0, Math.min(255, Math.round((n & 255) * (1 + amt))));
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}

/* ---------- 三选一强化（参考打了个龙） ---------- */
const UPGRADES = [
  { id: 'dmg',     name: '伤害强化', base: '子弹伤害 +50%',           apply: m => dmgMul += 0.5 * m },
  { id: 'rate',    name: '射速强化', base: '射速 +25%',               apply: m => rateMul += 0.25 * m },
  { id: 'multi',   name: '多重射击', base: '子弹数量 +1',             apply: m => extraBullets += (m >= 1.6 ? 2 : 1) },
  { id: 'crit',    name: '暴击强化', base: '暴击率 +15%（双倍伤害）', apply: m => critChance = Math.min(0.8, critChance + 0.15 * m) },
  { id: 'speed',   name: '弹速强化', base: '子弹速度 +30%',           apply: m => bulletSpeedMul += 0.3 * m },
  { id: 'pierce',  name: '穿透强化', base: '子弹可多穿透 1 片',       apply: m => pierceExtra += 1 },
  { id: 'thunder', name: '雷电之芽', base: '副武器：命中触发落雷',    apply: m => thunderWeapon = true }
];
const TIERS = [
  { key: 'C', mult: 1,   color: '#9aa5b1' },
  { key: 'B', mult: 1.6, color: '#4dabf7' },
  { key: 'A', mult: 2.2, color: '#da77f2' }
];
function openUpgrade() {
  upgradeOpen = true;
  upgradeCards = [];
  const pool = UPGRADES.slice();
  const grid = document.getElementById('upgradeCards');
  grid.innerHTML = '';
  for (let i = 0; i < 3 && pool.length; i++) {
    const u = pool.splice(Math.floor(Math.random() * pool.length), 1)[0];
    const tr = TIERS[Math.random() < 0.6 ? 0 : Math.random() < 0.7 ? 1 : 2];
    upgradeCards.push({ u, tr });
    const btn = document.createElement('button');
    btn.className = 'upCard';
    btn.style.borderColor = tr.color;
    btn.innerHTML = '<span class="tier" style="background:' + tr.color + '">' + tr.key + '</span>' +
      '<b>' + u.name + '</b><i>' + u.base + (tr.mult > 1 ? ' ×' + tr.mult.toFixed(1) : '') + '</i>';
    btn.addEventListener('click', () => applyUpgrade(i));
    grid.appendChild(btn);
  }
  show('upgradeOv');
}
function applyUpgrade(i) {
  const card = upgradeCards[i];
  if (card) card.u.apply(card.tr.mult);
  upgradeOpen = false;
  hideAll();
  sfx.pickup();
}

/* ---------- 主循环 ---------- */
let lastT = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  let rdt = (now - lastT) / 1000;
  lastT = now;
  rdt = Math.min(rdt, 0.05);
  if (!paused) update(rdt);
  render();
}
requestAnimationFrame(frame);

/* ---------- UI ---------- */
const OVS = ['menuOv', 'levelsOv', 'clearOv', 'overOv', 'pauseOv', 'upgradeOv'];
function hideAll() { OVS.forEach(id => document.getElementById(id).classList.add('hidden')); }
function show(id) { hideAll(); document.getElementById(id).classList.remove('hidden'); }
function refreshMenu() {
  document.getElementById('btnContinue').textContent = '开始挑战 · 第 ' + Math.min(progress.unlocked, MAX_LEVEL) + ' 关';
  document.getElementById('btnMute').textContent = muted ? '🔇 音效：关' : '🔊 音效：开';
}
function buildLevelGrid() {
  const grid = document.getElementById('levelGrid');
  grid.innerHTML = '';
  for (let i = 1; i <= MAX_LEVEL; i++) {
    const btn = document.createElement('button');
    const locked = i > progress.unlocked;
    btn.className = 'lvBtn' + (locked ? ' locked' : '');
    if (locked) {
      btn.textContent = '🔒';
    } else {
      const st = progress.stars[i] || 0;
      btn.innerHTML = String(i) + '<span class="st">' + (st ? '★★★'.slice(0, st) : '· · ·') + '</span>';
      btn.addEventListener('click', () => { ensureAudio(); startLevel(i); });
    }
    grid.appendChild(btn);
  }
}
document.getElementById('btnContinue').addEventListener('click', () => { ensureAudio(); startLevel(progress.unlocked); });
document.getElementById('btnLevels').addEventListener('click', () => { buildLevelGrid(); show('levelsOv'); });
document.getElementById('btnBackMenu').addEventListener('click', () => { state = S_MENU; refreshMenu(); show('menuOv'); });
document.getElementById('btnMute').addEventListener('click', () => {
  muted = !muted;
  try { localStorage.setItem('brickBlaster.muted', muted ? '1' : '0'); } catch (e) {}
  refreshMenu();
  if (!muted) { ensureAudio(); blip(660, 0.08, 'triangle', 0.15); }
});
document.getElementById('btnNext').addEventListener('click', () => startLevel(level + 1));
document.getElementById('btnReplay').addEventListener('click', () => startLevel(level));
document.getElementById('btnRetry').addEventListener('click', () => startLevel(level));
document.getElementById('btnToLevels').addEventListener('click', () => { buildLevelGrid(); show('levelsOv'); });
document.getElementById('btnToLevels2').addEventListener('click', () => { state = S_MENU; buildLevelGrid(); show('levelsOv'); });
document.getElementById('btnResume').addEventListener('click', () => { paused = false; hideAll(); });
document.getElementById('btnQuit').addEventListener('click', () => { paused = false; state = S_MENU; refreshMenu(); show('menuOv'); });
document.addEventListener('visibilitychange', () => {
  if (document.hidden && state === S_PLAY && !paused) { paused = true; show('pauseOv'); }
});

/* 调试接口（自动化测试用） */
window.__bb = {
  startLevel,
  gunnerTo: px => { gunnerTarget = clampTarget(px); },
  give: t => giveBuff(t),
  weaken: () => { bricks.forEach(b => { b.hp = 1; }); },
  nuke: () => { bricks.slice().forEach(b => shatterSegment(b, true)); },
  forceDescend: px => { rowY += px; descent += px; },
  get state() { return state; },
  get level() { return level; },
  get score() { return score; },
  get bulletsCount() { return bullets.length; },
  get brickCount() { return bricks.length; },
  get gunnerX() { return gunnerX; },
  get snakeHead() { return { x: Math.round(head.x), y: Math.round(head.y) }; },
  get powerupCount() { return powerups.length; },
  get stats() { return { dmgMul, rateMul, extraBullets, critChance, pierceExtra, thunderWeapon }; },
  forceUpgrade: () => openUpgrade(),
  get descent() { return Math.round(descent); }
};
refreshMenu();
show('menuOv');
</script>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>暴击砖块 · 手机版</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { width:100%; height:100%; overflow:hidden; background:#0f1226; overscroll-behavior:none;
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    user-select:none; -webkit-user-select:none; }
  #game { display:block; width:100%; height:100%; touch-action:none; }
  .overlay { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; background:radial-gradient(ellipse at center, rgba(15,18,38,.62), rgba(8,9,22,.88));
    backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
    transition: opacity .25s ease; z-index:10; text-align:center;
    padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right))
             max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left)); }
  .overlay.hidden { opacity:0; pointer-events:none; }
  h1 { color:#fff; font-size:clamp(2.2rem, 8vw, 3.6rem); font-weight:900; letter-spacing:.06em;
    text-shadow:0 0 24px rgba(90,140,255,.55), 0 4px 0 rgba(0,0,0,.35); }
  h2 { color:#fff; font-size:clamp(1.6rem, 6vw, 2.4rem); font-weight:800; }
  .sub { color:rgba(255,255,255,.62); font-size:.95rem; letter-spacing:.12em; margin-top:-8px; }
  .hint { color:rgba(255,255,255,.42); font-size:.82rem; margin-top:10px; line-height:1.7; }
  button { border:none; cursor:pointer; font-family:inherit; font-weight:700; color:#fff;
    font-size:1.05rem; padding:13px 34px; border-radius:999px;
    background:linear-gradient(180deg,#4c6ef5,#364fc7);
    box-shadow:0 6px 18px rgba(58,80,220,.45), inset 0 1px 0 rgba(255,255,255,.25);
    transition:transform .12s ease, box-shadow .12s ease; }
  button:hover { transform:translateY(-2px); box-shadow:0 10px 24px rgba(58,80,220,.55), inset 0 1px 0 rgba(255,255,255,.25); }
  button:active { transform:translateY(1px) scale(.97); }
  button.ghost { background:rgba(255,255,255,.08); box-shadow:none; font-size:.92rem; padding:10px 26px; }
  .row { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }
  #starsBig { font-size:2.6rem; letter-spacing:.15em; color:#ffd43b; text-shadow:0 0 18px rgba(255,212,59,.5); }
  #starsBig .off { color:rgba(255,255,255,.18); text-shadow:none; }
  #clearStats, #overStats { color:rgba(255,255,255,.75); font-size:.95rem; line-height:1.8; }
  #clearStats b, #overStats b { color:#ffd43b; }
  #levelGrid { display:grid; grid-template-columns:repeat(auto-fill, minmax(50px, 1fr)); gap:8px;
    width:min(640px, 92vw); max-height:52vh; overflow-y:auto; padding:6px; }
  .lvBtn { width:auto; height:52px; border-radius:12px; font-size:1rem; padding:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
    background:rgba(255,255,255,.09); box-shadow:none; }
  .lvBtn .st { font-size:.6rem; color:#ffd43b; letter-spacing:0; }
  .lvBtn.locked { opacity:.28; cursor:not-allowed; }
  #recordBadge { display:inline-block; background:linear-gradient(90deg,#ffd43b,#ff922b); color:#5c3c00;
    font-size:.75rem; font-weight:800; padding:3px 12px; border-radius:999px; letter-spacing:.1em; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="menuOv" class="overlay">
  <h1>暴击砖块</h1>
  <p class="sub">长蛇砖阵 · 炫目技能 · 100 关闯关</p>
  <button id="btnContinue">开始挑战</button>
  <button id="btnLevels" class="ghost">选 关</button>
  <button id="btnMute" class="ghost">🔊 音效：开</button>
  <p class="hint">屏幕任意处左右滑动控制横板（手指不必压在弹板上），点按发射<br>球撞到蛇身后会随机偏转 · 全部掉落扣一条命（共 3 条）<br>打碎蛇鳞随机掉技能：分裂 / 火球 / 激光 / 天雷 / 陨石雨 · 全清蛇鳞过关</p>
</div>

<div id="levelsOv" class="overlay hidden">
  <h2>选关（共 100 关）</h2>
  <div id="levelGrid"></div>
  <button id="btnBackMenu" class="ghost">返回</button>
</div>

<div id="clearOv" class="overlay hidden">
  <h2>过 关 ！</h2>
  <div id="starsBig"></div>
  <p id="clearStats"></p>
  <div class="row">
    <button id="btnNext">下一关</button>
    <button id="btnReplay" class="ghost">重玩本关</button>
    <button id="btnToLevels" class="ghost">选关</button>
  </div>
</div>

<div id="overOv" class="overlay hidden">
  <h2>弹球掉光了…</h2>
  <p id="overStats"></p>
  <div class="row">
    <button id="btnRetry">再来一次</button>
    <button id="btnToLevels2" class="ghost">选关</button>
  </div>
</div>

<div id="pauseOv" class="overlay hidden">
  <h2>已暂停</h2>
  <div class="row">
    <button id="btnResume">继续</button>
    <button id="btnQuit" class="ghost">回主菜单</button>
  </div>
</div>

<script>
'use strict';
/* ============================================================
   暴击砖块 · 长蛇砖阵 100 关
   数字格串成一条会游走的长蛇：蛇头带路、蛇身跟随
   球撞蛇身后随机偏转；碎鳞掉落炫目技能
   分裂 / 火球(穿透) / 激光 / 天雷(连锁) / 陨石雨
   单文件 / 零外部资源：Canvas 手绘 + WebAudio 合成音效
   ============================================================ */
const TAU = Math.PI * 2;
const MAX_LEVEL = 100;
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

/* ---------- 自适应 ---------- */
let W = 0, H = 0, DPR = 1;
let CELL = 50, BRICK_H = 26, GAP = 5, BALL_R = 7, SEG_SPACING = 44;
let offX = 0, playW = 0, TOP = 90;
let paddleY = 0, bgGrad = null;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  CELL = Math.min(W / 9, 58);
  playW = CELL * 9;
  offX = (W - playW) / 2;
  BRICK_H = Math.round(CELL * 0.52);
  GAP = Math.max(3, Math.round(CELL * 0.08));
  BALL_R = Math.max(5, CELL * 0.11);
  SEG_SPACING = Math.max(26, CELL * 0.92);
  TOP = Math.max(72, H * 0.11);
  paddleY = H - 58;
  bgGrad = ctx.createLinearGradient(0, 0, 0, H);
  bgGrad.addColorStop(0, '#141a3a');
  bgGrad.addColorStop(0.55, '#101228');
  bgGrad.addColorStop(1, '#1a1030');
}
window.addEventListener('resize', resize);
resize();

/* ---------- 存档 ---------- */
const SAVE_KEY = 'brickBlaster.snake.v1';
let progress = { unlocked: 1, stars: {} };
try {
  const raw = localStorage.getItem(SAVE_KEY);
  if (raw) { const p = JSON.parse(raw); if (p && p.unlocked) progress = p; }
} catch (e) {}
function saveProgress() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(progress)); } catch (e) {} }

/* ---------- 音效（WebAudio 合成） ---------- */
let AC = null, master = null, noiseBuf = null;
let muted = false;
try { muted = localStorage.getItem('brickBlaster.muted') === '1'; } catch (e) {}

function ensureAudio() {
  if (!AC) {
    const Ctor = window.AudioContext || window.webkitAudioContext;
    if (!Ctor) return;
    AC = new Ctor();
    master = AC.createGain(); master.gain.value = 0.42; master.connect(AC.destination);
    noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  if (AC.state === 'suspended') AC.resume();
}
function blip(freq, dur, type, vol, slideTo) {
  if (!AC || muted) return;
  const t = AC.currentTime;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'triangle';
  o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(slideTo, 1), t + dur);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.008);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t + dur + 0.02);
}
function noiseHit(dur, freq, vol, type) {
  if (!AC || muted) return;
  const t = AC.currentTime;
  const s = AC.createBufferSource(); s.buffer = noiseBuf;
  const f = AC.createBiquadFilter(); f.type = type || 'lowpass'; f.frequency.value = freq;
  const g = AC.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(f); f.connect(g); g.connect(master);
  s.start(t); s.stop(t + dur + 0.02);
}
const sfx = {
  hit(streak) { blip(320 * Math.pow(1.045, Math.min(streak, 26)), 0.05, 'square', 0.10); },
  pop(streak, hp) {
    noiseHit(0.1, 1600, 0.22);
    blip(460 * Math.pow(1.05, Math.min(streak, 20)), 0.09, 'triangle', 0.18, 180);
    if (hp >= 8) blip(140, 0.12, 'sine', 0.16, 60);
  },
  thump() { blip(200, 0.07, 'sine', 0.22, 90); noiseHit(0.04, 900, 0.1); },
  launch() { noiseHit(0.08, 3000, 0.12, 'highpass'); blip(500, 0.08, 'sine', 0.12, 900); },
  pickup() { blip(660, 0.09, 'triangle', 0.2); setTimeout(() => blip(990, 0.12, 'triangle', 0.2), 80); },
  split() { blip(440, 0.07, 'square', 0.14); setTimeout(() => blip(660, 0.07, 'square', 0.14), 60); setTimeout(() => blip(880, 0.09, 'square', 0.14), 120); },
  laser() { blip(1200, 0.06, 'sawtooth', 0.08, 500); },
  thunder() { noiseHit(0.15, 2400, 0.25, 'highpass'); blip(180, 0.18, 'sawtooth', 0.16, 60); },
  meteor() { noiseHit(0.3, 700, 0.3); blip(120, 0.3, 'sine', 0.2, 40); },
  fire() { noiseHit(0.4, 900, 0.22); blip(320, 0.25, 'sawtooth', 0.12, 90); },
  lose() { blip(300, 0.35, 'sawtooth', 0.18, 90); },
  clear() { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => blip(f, 0.22, 'triangle', 0.22), i * 95)); },
  fail() { blip(220, 0.55, 'sawtooth', 0.22, 70); noiseHit(0.4, 500, 0.25); },
  aim() { blip(520, 0.04, 'sine', 0.08); }
};
function buzz(ms) { if (navigator.vibrate) try { navigator.vibrate(ms); } catch (e) {} }

/* ---------- 关卡参数（种子随机，100 关） ---------- */
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function genLevel(n) {
  return {
    len: Math.min(12 + Math.round(n * 1.1), 40),            // 蛇身节数
    hpBase: 1 + Math.floor((n - 1) / 12),                    // 基础血量 1→9
    snakeSpeed: Math.min(50 + n * 1.2, 170),                 // 游走速度
    turnT: Math.max(1.0, 2.6 - n * 0.015),                   // 转向频率
    ballSpeed: Math.min(520 + (n - 1) * 3, 800),
    paddleFactor: Math.max(2.5 - Math.floor((n - 1) / 20) * 0.2, 1.7)  // 每过20关缩一档
  };
}

/* ---------- 游戏状态 ---------- */
const S_MENU = 'menu', S_PLAY = 'play', S_CLEAR = 'clear', S_OVER = 'over';
let state = S_MENU;
let level = 1, levelData = null;
let bricks = [];                 // 蛇身鳞片（数字格）
let head = { x: 0, y: 0, ang: 0 };
let heading = 0, turnVel = 0.6, snakeT = 0;
let balls = [], powerups = [], lasers = [], meteors = [], bolts = [];
let particles = [], popups = [];
let score = 0, lives = 3, livesLost = 0, streak = 0, shatterCount = 0;
let introT = 1;
let timeScale = 1, slowmoT = 0, shake = 0, flash = 0, flashColor = '255,255,255';
let paused = false, overT = 0;
let fireT = 0, laserT = 0, thunderT = 0, laserCd = 0, meteorQueue = 0, meteorCd = 0;
let paddleX = 0, paddleTarget = 0, paddlePunch = 0;
let keys = { left: false, right: false };

function paddleW() { return Math.max(70, CELL * (levelData ? levelData.paddleFactor : 2.5)); }
function baseSpeed() { return levelData ? levelData.ballSpeed : 520; }

/* ---------- 关卡流程 ---------- */
function buildSnake() {
  const rnd = mulberry32(level * 2654435 + 17);
  const n = levelData.len;
  bricks = [];
  head = { x: offX + playW * 0.5, y: TOP + 60 };
  heading = rnd() < 0.5 ? 0 : Math.PI;
  turnVel = (rnd() < 0.5 ? -1 : 1) * 0.8;
  snakeT = levelData.turnT;
  for (let i = 0; i < n; i++) {
    const hp = Math.max(1, Math.min(30,
      levelData.hpBase + Math.floor(i / 7) + (rnd() < 0.25 ? 1 : 0)));
    bricks.push({
      x: head.x - i * SEG_SPACING, y: head.y + Math.sin(i * 0.55) * 16,
      ang: 0, hp, maxHp: hp, flash: 0, punch: 0, cd: 0
    });
  }
}
function spawnStuckBall() {
  balls = [{ x: paddleX, y: paddleY - BALL_R - 4, vx: 0, vy: 0, stuck: true, trail: [] }];
}
function startLevel(n) {
  level = Math.min(n, MAX_LEVEL);
  levelData = genLevel(level);
  buildSnake();
  balls = []; powerups = []; lasers = []; meteors = []; bolts = [];
  particles = []; popups = [];
  score = 0; lives = 3; livesLost = 0; streak = 0; shatterCount = 0;
  fireT = 0; laserT = 0; thunderT = 0; laserCd = 0; meteorQueue = 0;
  slowmoT = 0; shake = 0; flash = 0; overT = 0;
  introT = 0;
  paddleTarget = W / 2; paddleX = W / 2;
  spawnStuckBall();
  paused = false;
  state = S_PLAY;
  hideAll();
}
function launch() {
  for (const b of balls) {
    if (!b.stuck) continue;
    const a = (Math.random() * 22 - 11) * Math.PI / 180;
    const s = baseSpeed();
    b.stuck = false;
    b.vx = Math.sin(a) * s; b.vy = -Math.cos(a) * s;
    sfx.launch();
  }
}
function doFail() {
  state = S_OVER;
  overT = 0;
  shake = 16; flash = 0.35; flashColor = '255,70,70';
  sfx.fail(); buzz(180);
}
function doClear() {
  state = S_CLEAR;
  overT = 0;
  slowmoT = 0.55;
  score += 100 * lives;
  sfx.clear(); buzz(60);
  let stars = 1;
  if (livesLost === 0) stars = 3; else if (livesLost === 1) stars = 2;
  const isNew = !(level in progress.stars) || progress.stars[level] < stars;
  progress.stars[level] = Math.max(progress.stars[level] || 0, stars);
  if (level < MAX_LEVEL) progress.unlocked = Math.max(progress.unlocked, level + 1);
  saveProgress();
  const cols = ['#ff6b6b', '#ffd43b', '#69db7c', '#4dabf7', '#da77f2', '#ffa94d'];
  for (let i = 0; i < 70; i++) {
    particles.push({
      type: 'confetti',
      x: W / 2 + (Math.random() * 2 - 1) * 60, y: H * 0.42,
      vx: (Math.random() * 2 - 1) * 420, vy: -Math.random() * 520 - 120,
      w: 5 + Math.random() * 6, h: 3 + Math.random() * 4,
      rot: Math.random() * TAU, vr: (Math.random() * 2 - 1) * 12,
      color: cols[i % cols.length], life: 1.4 + Math.random() * 0.6, age: 0, grav: 780
    });
  }
  setTimeout(() => {
    if (state !== S_CLEAR) return;
    document.getElementById('starsBig').innerHTML =
      '★★★'.slice(0, stars) + '<span class="off">' + '★★★'.slice(stars) + '</span>';
    const finale = level === MAX_LEVEL ? '<span id="recordBadge">🏆 100 关全部通关！！</span><br>' : '';
    document.getElementById('clearStats').innerHTML =
      finale + (isNew ? '<span id="recordBadge">新纪录！</span><br>' : '') +
      '第 <b>' + level + '</b> 关 · 剩余生命 <b>' + lives + '</b>（3★ = 一球未失）<br>得分 <b>' + score + '</b>';
    show('clearOv');
  }, 950);
}

/* ---------- 特效基元 ---------- */
function addShards(x, y, color, n, power) {
  for (let i = 0; i < n; i++) {
    particles.push({
      type: 'shard', x, y,
      vx: (Math.random() * 2 - 1) * 240 * power, vy: -Math.random() * 260 * power - 40,
      w: 4 + Math.random() * 8, h: 3 + Math.random() * 6,
      rot: Math.random() * TAU, vr: (Math.random() * 2 - 1) * 10,
      color, life: 0.7 + Math.random() * 0.4, age: 0, grav: 900
    });
  }
}
function addSparks(x, y, n, color, power) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * TAU, sp = (60 + Math.random() * 200) * power;
    particles.push({
      type: 'spark', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      w: 1.5 + Math.random() * 2.5, h: 0, rot: 0, vr: 0,
      color, life: 0.3 + Math.random() * 0.3, age: 0, grav: 200
    });
  }
}
function addPopup(x, y, text, color, size) {
  popups.push({ x, y, text, color, size: size || 18, age: 0, life: 0.75, vy: -72 });
}
function addBolt(x1, y1, x2, y2) {
  const pts = [{ x: x1, y: y1 }];
  const segs = 5;
  for (let i = 1; i < segs; i++) {
    const k = i / segs;
    pts.push({ x: x1 + (x2 - x1) * k + (Math.random() * 2 - 1) * 14, y: y1 + (y2 - y1) * k + (Math.random() * 2 - 1) * 14 });
  }
  pts.push({ x: x2, y: y2 });
  bolts.push({ pts, life: 0.18, age: 0 });
}

/* ---------- 蛇鳞：受击 / 碎裂 / 掉技能 ---------- */
function tierColor(hp) {
  if (hp >= 20) return ['#e03131', '#7a1717'];
  if (hp >= 12) return ['#f76707', '#8f3b00'];
  if (hp >= 7)  return ['#f59f00', '#8a5c00'];
  if (hp >= 4)  return ['#37b24d', '#1d6630'];
  if (hp >= 2)  return ['#15aabf', '#0a5460'];
  return ['#4c6ef5', '#22347f'];
}
function damageSegment(s, dmg, chain) {
  if (s.hp <= 0) return;
  s.hp -= dmg;
  s.flash = 1; s.punch = 1;
  if (s.hp <= 0) {
    shatterSegment(s, chain);
  } else {
    score += 1;
    addSparks(s.x, s.y, 3, 'rgba(255,255,255,0.9)', 0.8);
    shake = Math.min(shake + 0.4, 4);
    sfx.hit(streak);
  }
}
function shatterSegment(s, chain) {
  const col = tierColor(s.maxHp);
  addShards(s.x, s.y, col[0], 5 + Math.min(Math.floor(s.maxHp / 3), 5), 0.7 + Math.min(s.maxHp * 0.06, 0.8));
  addSparks(s.x, s.y, 6, 'rgba(255,255,255,0.85)', 1);
  shake = Math.min(shake + 1.1 + s.maxHp * 0.2, 13);
  score += s.maxHp * 5;
  addPopup(s.x, s.y, '+' + (s.maxHp * 5), '#fff', 15 + Math.min(s.maxHp, 14));
  streak++;
  sfx.pop(streak, s.maxHp);
  buzz(10);
  const i = bricks.indexOf(s);
  if (i >= 0) bricks.splice(i, 1);
  // 天雷：连锁闪电劈向最近蛇鳞
  if (thunderT > 0 && !chain) chainStrike(s);
  // 掉技能
  shatterCount++;
  if (shatterCount % 8 === 0 || Math.random() < 0.08) dropPowerup(s.x, s.y);
  if (bricks.length === 0 && state === S_PLAY) doClear();
}
function chainStrike(from) {
  const near = bricks
    .map(b => ({ b, d: (b.x - from.x) ** 2 + (b.y - from.y) ** 2 }))
    .filter(o => o.d < 170 * 170)
    .sort((a, b) => a.d - b.d)
    .slice(0, 2);
  for (const o of near) {
    addBolt(from.x, from.y, o.b.x, o.b.y);
    damageSegment(o.b, 1, true);
  }
  if (near.length) { sfx.thunder(); flash = Math.max(flash, 0.12); flashColor = '255,240,150'; }
}

/* ---------- 技能 ---------- */
const POWER_TYPES = {
  multi:  { label: '分', color: '#ff922b', name: '弹球分裂！' },
  fire:   { label: '火', color: '#ff6b6b', name: '火球穿透！' },
  laser:  { label: '光', color: '#4dabf7', name: '激光扫射！' },
  thunder:{ label: '雷', color: '#ffd43b', name: '天雷连锁！' },
  meteor: { label: '陨', color: '#da77f2', name: '陨石雨！' }
};
const POWER_KEYS = Object.keys(POWER_TYPES);
function dropPowerup(x, y) {
  const type = POWER_KEYS[Math.floor(Math.random() * POWER_KEYS.length)];
  powerups.push({ x, y, vy: 170, type, rot: 0 });
}
function splitBalls() {
  const flying = balls.filter(b => !b.stuck);
  if (flying.length === 0) return;
  const s = baseSpeed();
  const add = [];
  for (const b of flying) {
    if (balls.length + add.length >= 9) break;
    for (const da of [-0.42, 0.42]) {
      if (balls.length + add.length >= 9) break;
      const ang = Math.atan2(b.vx, -b.vy) + da;
      add.push({ x: b.x, y: b.y, vx: Math.sin(ang) * s, vy: -Math.cos(ang) * s, stuck: false, trail: [] });
    }
  }
  balls = balls.concat(add);
}
function rainMeteors() {
  meteorQueue += 6;
  meteorCd = 0;
}
function catchPowerup(p) {
  const def = POWER_TYPES[p.type];
  score += 50;
  addPopup(paddleX, paddleY - 30, def.name, def.color, 19);
  addSparks(p.x, p.y, 10, def.color, 1.2);
  flash = Math.max(flash, 0.1); flashColor = '200,190,255';
  if (p.type === 'multi') { splitBalls(); sfx.split(); }
  else if (p.type === 'fire') { fireT = 8; sfx.fire(); }
  else if (p.type === 'laser') { laserT = 6; laserCd = 0; sfx.laser(); }
  else if (p.type === 'thunder') { thunderT = 8; sfx.thunder(); }
  else if (p.type === 'meteor') { rainMeteors(); sfx.meteor(); }
  buzz(20);
}

/* ---------- 生命 ---------- */
function loseLife() {
  lives--; livesLost++;
  streak = 0;
  flash = Math.max(flash, 0.25); flashColor = '255,70,70';
  shake = Math.max(shake, 8);
  sfx.lose(); buzz(120);
  if (lives <= 0) { doFail(); return; }
  addPopup(W / 2, H - 140, '剩余生命 ' + lives, '#ff8787', 22);
  spawnStuckBall();
}

/* ---------- 输入 ---------- */
/* 触屏：增量拖动（手指不必按在弹板上，不挡球）；鼠标：绝对映射 */
let touchAnchorX = null, paddleAnchor = null;
function clampTarget(x) { return Math.max(offX, Math.min(offX + playW, x)); }
canvas.addEventListener('pointerdown', e => {
  ensureAudio();
  if (state !== S_PLAY || paused) return;
  if (e.pointerType === 'touch') {
    touchAnchorX = e.clientX;
    paddleAnchor = paddleTarget;
  } else {
    paddleTarget = clampTarget(e.clientX);
  }
  if (introT >= 1) { sfx.aim(); launch(); }
});
window.addEventListener('pointermove', e => {
  if (state !== S_PLAY || paused) return;
  if (e.pointerType === 'touch') {
    if (touchAnchorX !== null) paddleTarget = clampTarget(paddleAnchor + (e.clientX - touchAnchorX) * 1.15);
  } else {
    paddleTarget = clampTarget(e.clientX);
  }
});
function releaseTouch(e) { if (e.pointerType === 'touch') touchAnchorX = null; }
window.addEventListener('pointerup', releaseTouch);
window.addEventListener('pointercancel', releaseTouch);
canvas.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') { keys.left = true; e.preventDefault(); }
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') { keys.right = true; e.preventDefault(); }
  if (e.code === 'Space') { ensureAudio(); if (state === S_PLAY && !paused && introT >= 1) launch(); e.preventDefault(); }
  if (e.key === 'Escape' && (state === S_PLAY)) {
    paused = !paused;
    if (paused) show('pauseOv'); else hideAll();
  }
});
window.addEventListener('keyup', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
});

/* ---------- 碰撞 ---------- */
function reflectWalls(b) {
  const L = offX + BALL_R, R = offX + playW - BALL_R, T = 6 + BALL_R;
  if (b.x < L) { b.x = L; b.vx = Math.abs(b.vx); }
  else if (b.x > R) { b.x = R; b.vx = -Math.abs(b.vx); }
  if (b.y < T) { b.y = T; b.vy = Math.abs(b.vy); }
}
function hitPaddle(b) {
  const w = paddleW();
  const pl = paddleX - w / 2 - BALL_R, pr = paddleX + w / 2 + BALL_R;
  if (b.vy <= 0 || b.y + BALL_R < paddleY || b.y - BALL_R > paddleY + 18) return;
  if (b.x < pl || b.x > pr) return;
  const offset = Math.max(-1, Math.min(1, (b.x - paddleX) / (w / 2)));
  const ang = offset * (62 * Math.PI / 180);
  const s = baseSpeed();
  b.vx = Math.sin(ang) * s;
  b.vy = -Math.cos(ang) * s;
  b.y = paddleY - BALL_R - 1;
  paddlePunch = 1;
  shake = Math.min(shake + 1.2, 5);
  sfx.thump(); buzz(8);
  if (streak >= 4) {
    const bonus = streak * 2;
    score += bonus;
    addPopup(paddleX, paddleY - 40, '连击 ×' + streak + '  +' + bonus, '#ffd43b', 20);
  }
  streak = 0;
}
/* 圆 vs 旋转鳞片（OBB）：反射 + 随机偏转；火球模式穿透 */
function collideSegments(b) {
  const fire = fireT > 0;
  for (const s of bricks) {
    const dx = b.x - s.x, dy = b.y - s.y;
    const broad = BRICK_H * 1.6 + BALL_R;
    if (dx * dx + dy * dy > broad * broad) continue;
    const ca = Math.cos(-s.ang), sa = Math.sin(-s.ang);
    const lx = dx * ca - dy * sa, ly = dx * sa + dy * ca;
    const hw = (CELL - GAP) / 2, hh = BRICK_H / 2;
    const cx = Math.max(-hw, Math.min(lx, hw));
    const cy = Math.max(-hh, Math.min(ly, hh));
    const ddx = lx - cx, ddy = ly - cy;
    const d2 = ddx * ddx + ddy * ddy;
    if (d2 > BALL_R * BALL_R) continue;

    if (fire) {
      if (s.cd > 0) continue;
      s.cd = 0.18;
      damageSegment(s, 3, false);
      continue;                          // 火球穿透，不反弹
    }
    let nlx, nly;
    if (d2 > 1e-6) {
      const d = Math.sqrt(d2);
      nlx = ddx / d; nly = ddy / d;
    } else {
      const px = hw - Math.abs(lx), py = hh - Math.abs(ly);
      if (px < py) { nlx = lx < 0 ? -1 : 1; nly = 0; }
      else { nlx = 0; nly = ly < 0 ? -1 : 1; }
    }
    const ca2 = Math.cos(s.ang), sa2 = Math.sin(s.ang);
    const wnx = nlx * ca2 - nly * sa2;
    const wny = nlx * sa2 + nly * ca2;
    const dot = b.vx * wnx + b.vy * wny;
    if (dot < 0) { b.vx -= 2 * dot * wnx; b.vy -= 2 * dot * wny; }
    if (d2 > 1e-6) {
      const push = BALL_R - Math.sqrt(d2) + 0.5;
      b.x += wnx * push; b.y += wny * push;
    }
    // 球撞蛇身后随机偏转
    const jitter = (Math.random() * 0.9 - 0.45);
    const cs = Math.cos(jitter), sn = Math.sin(jitter);
    const nvx = b.vx * cs - b.vy * sn;
    const nvy = b.vx * sn + b.vy * cs;
    b.vx = nvx; b.vy = nvy;

    addSparks(b.x, b.y, 3, 'rgba(255,255,255,0.9)', 0.8);
    damageSegment(s, 1, false);
    break;
  }
}

/* ---------- 更新 ---------- */
function update(rdt) {
  if (slowmoT > 0) slowmoT -= rdt;
  timeScale += ((slowmoT > 0 ? 0.3 : 1) - timeScale) * Math.min(1, rdt * 10);
  const dt = rdt * timeScale;

  introT = Math.min(1, introT + rdt * 2);
  if (fireT > 0) fireT -= rdt;
  if (laserT > 0) laserT -= rdt;
  if (thunderT > 0) thunderT -= rdt;

  // 长蛇游走：蛇头带路，蛇身跟随
  if (state === S_PLAY && introT >= 0.3) {
    snakeT -= dt;
    if (snakeT <= 0) {
      snakeT = levelData.turnT * (0.7 + Math.random() * 0.6);
      turnVel = (Math.random() * 2 - 1) * 1.5;
    }
    heading += turnVel * dt;
    head.x += Math.cos(heading) * levelData.snakeSpeed * dt;
    head.y += Math.sin(heading) * levelData.snakeSpeed * dt;
    const bx0 = offX + 34, bx1 = offX + playW - 34;
    const by0 = TOP + 26, by1 = TOP + Math.min(210, H * 0.3);
    if (head.x < bx0) { head.x = bx0; heading = Math.PI - heading; }
    else if (head.x > bx1) { head.x = bx1; heading = Math.PI - heading; }
    if (head.y < by0) { head.y = by0; heading = -heading; }
    else if (head.y > by1) { head.y = by1; heading = -heading; }
    if (head.y < by0 + 12 && Math.sin(heading) < 0) heading = -heading;
    if (Math.abs(heading) < 0.25) heading = (heading < 0 ? -1 : 1) * 0.25; // 防贴边水平死走
    for (let i = 0; i < bricks.length; i++) {
      const s = bricks[i];
      const px = i === 0 ? head.x : bricks[i - 1].x;
      const py = i === 0 ? head.y : bricks[i - 1].y;
      let dx = px - s.x, dy = py - s.y;
      let d = Math.hypot(dx, dy);
      if (d < 0.001) { dx = 1; dy = 0; d = 1; }
      s.x += dx / d * (d - SEG_SPACING);
      s.y += dy / d * (d - SEG_SPACING);
      s.ang = Math.atan2(dy, dx);
      s.cd = Math.max(0, s.cd - dt);
    }
  }

  // 横板
  const w = paddleW();
  if (keys.left) paddleTarget -= W * 1.1 * rdt;
  if (keys.right) paddleTarget += W * 1.1 * rdt;
  paddleTarget = Math.max(offX + w / 2, Math.min(offX + playW - w / 2, paddleTarget));
  paddleX += (paddleTarget - paddleX) * Math.min(1, rdt * 18);
  paddlePunch = Math.max(0, paddlePunch - rdt * 6);

  // 激光
  if (state === S_PLAY && laserT > 0) {
    laserCd -= rdt;
    if (laserCd <= 0) {
      laserCd = 0.3;
      lasers.push({ x: paddleX - w * 0.32, y: paddleY - 10 });
      lasers.push({ x: paddleX + w * 0.32, y: paddleY - 10 });
      sfx.laser();
    }
  }
  for (let i = lasers.length - 1; i >= 0; i--) {
    const l = lasers[i];
    l.y -= 950 * dt;
    let hit = false;
    for (const s of bricks) {
      const dx = l.x - s.x, dy = l.y - s.y;
      if (dx * dx + dy * dy < Math.pow(CELL * 0.42, 2)) {
        damageSegment(s, 1, false);
        addSparks(l.x, l.y, 4, '#4dabf7', 0.9);
        hit = true; break;
      }
    }
    if (hit || l.y < -20) lasers.splice(i, 1);
  }
  // 陨石
  if (state === S_PLAY && meteorQueue > 0) {
    meteorCd -= rdt;
    if (meteorCd <= 0) {
      meteorCd = 0.2;
      meteorQueue--;
      const target = bricks.length ? bricks[Math.floor(Math.random() * bricks.length)] : null;
      meteors.push({
        sx: offX + Math.random() * playW, sy: -30,
        target, t: 0, dur: 0.5 + Math.random() * 0.25
      });
    }
  }
  for (let i = meteors.length - 1; i >= 0; i--) {
    const m = meteors[i];
    m.t += dt;
    const k = Math.min(m.t / m.dur, 1);
    const tx = m.target ? m.target.x : m.sx;
    const ty = m.target ? m.target.y : H * 0.4;
    m.x = m.sx + (tx - m.sx) * k;
    m.y = m.sy + (ty - m.sy) * k - Math.sin(k * Math.PI) * 70;
    particles.push({ type: 'spark', x: m.x, y: m.y, vx: 0, vy: 0, w: 3, h: 0, rot: 0, vr: 0, color: '#da77f2', life: 0.25, age: 0, grav: 0 });
    if (k >= 1) {
      meteors.splice(i, 1);
      shake = Math.min(shake + 6, 14);
      addSparks(m.x, m.y, 14, '#da77f2', 1.4);
      addPopup(m.x, m.y - 20, '轰！', '#da77f2', 20);
      sfx.meteor(); buzz(20);
      if (m.target && bricks.includes(m.target)) damageSegment(m.target, 2, true);
      for (const s of bricks) {
        if (s === m.target) continue;
        const dx = s.x - m.x, dy = s.y - m.y;
        if (dx * dx + dy * dy < 100 * 100) damageSegment(s, 1, true);
      }
    }
  }
  // 闪电视觉
  for (let i = bolts.length - 1; i >= 0; i--) {
    bolts[i].age += rdt;
    if (bolts[i].age >= bolts[i].life) bolts.splice(i, 1);
  }

  // 弹球
  if (state === S_PLAY) {
    for (let i = balls.length - 1; i >= 0; i--) {
      const b = balls[i];
      if (b.stuck) { b.x = paddleX; b.y = paddleY - BALL_R - 4; b.trail.length = 0; continue; }
      const steps = 2;
      for (let s = 0; s < steps; s++) {
        b.x += b.vx * dt / steps;
        b.y += b.vy * dt / steps;
        reflectWalls(b);
        hitPaddle(b);
        collideSegments(b);
        if (state !== S_PLAY) break;
      }
      const s2 = baseSpeed();
      const sp = Math.hypot(b.vx, b.vy) || 1;
      b.vx = b.vx / sp * s2; b.vy = b.vy / sp * s2;
      if (Math.abs(b.vy) < s2 * 0.18) {
        b.vy = (b.vy < 0 ? -1 : 1) * s2 * 0.18;
        const vx2 = Math.sqrt(Math.max(s2 * s2 - b.vy * b.vy, 1));
        b.vx = (b.vx < 0 ? -1 : 1) * vx2;
      }
      b.trail.push({ x: b.x, y: b.y });
      if (b.trail.length > 9) b.trail.shift();
      if (fireT > 0 && Math.random() < 0.3) {
        particles.push({ type: 'spark', x: b.x, y: b.y, vx: 0, vy: -30, w: 2.5, h: 0, rot: 0, vr: 0, color: '#ff922b', life: 0.3, age: 0, grav: 0 });
      }
      if (b.y - BALL_R > H + 20) balls.splice(i, 1);
    }
    if (state === S_PLAY && balls.length === 0 && introT >= 1) loseLife();

    // 技能胶囊下落
    for (let i = powerups.length - 1; i >= 0; i--) {
      const p = powerups[i];
      p.y += p.vy * dt; p.rot = Math.sin(p.y * 0.05) * 0.2;
      const w2 = paddleW();
      if (p.y > paddleY - 14 && p.y < paddleY + 26 && Math.abs(p.x - paddleX) < w2 / 2 + CELL * 0.4) {
        catchPowerup(p); powerups.splice(i, 1); continue;
      }
      if (p.y > H + 30) powerups.splice(i, 1);
    }
  }

  // 特效
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.age += rdt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vy += (p.grav || 0) * dt;
    p.rot += p.vr * dt;
    if (p.type === 'confetti') p.vx *= (1 - 0.8 * dt);
    if (p.age >= p.life) particles.splice(i, 1);
  }
  for (let i = popups.length - 1; i >= 0; i--) {
    const p = popups[i];
    p.age += rdt; p.y += p.vy * rdt;
    if (p.age >= p.life) popups.splice(i, 1);
  }
  for (const b of bricks) {
    b.flash = Math.max(0, b.flash - rdt * 6);
    b.punch = Math.max(0, b.punch - rdt * 7);
  }

  if (state === S_OVER) {
    overT += rdt;
    if (overT > 1.05 && document.getElementById('overOv').classList.contains('hidden')) {
      document.getElementById('overStats').innerHTML =
        '第 <b>' + level + '</b> 关 · 得分 <b>' + score + '</b><br>横板没接住，就差一点点！';
      show('overOv');
    }
  }
  if (state === S_CLEAR) overT += rdt;

  shake = Math.max(0, shake - shake * 7 * rdt - 6 * rdt);
  flash = Math.max(0, flash - rdt * 2.2);
}

/* ---------- 渲染 ---------- */
function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);
  ctx.save();
  if (shake > 0.2) ctx.translate((Math.random() * 2 - 1) * shake, (Math.random() * 2 - 1) * shake);
  ctx.globalAlpha = introT;
  drawRails();
  drawSnakeBody();
  drawBricks();
  drawPowerups();
  drawLasers();
  drawMeteors();
  drawBolts();
  drawParticles();
  drawPaddle();
  drawBalls();
  drawPopups();
  drawHUD();
  ctx.globalAlpha = 1;
  ctx.restore();
  if (flash > 0.01) {
    ctx.fillStyle = 'rgba(' + flashColor + ',' + Math.min(flash, 0.6) + ')';
    ctx.fillRect(0, 0, W, H);
  }
}
function drawRails() {
  ctx.fillStyle = 'rgba(255,255,255,0.045)';
  ctx.fillRect(offX - 6, 0, 6, H);
  ctx.fillRect(offX + playW, 0, 6, H);
}
function drawSnakeBody() {
  if (bricks.length < 2) return;
  ctx.save();
  ctx.strokeStyle = 'rgba(60,70,130,0.55)';
  ctx.lineWidth = BRICK_H * 0.92;
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(bricks[0].x, bricks[0].y);
  for (let i = 1; i < bricks.length; i++) ctx.lineTo(bricks[i].x, bricks[i].y);
  ctx.stroke();
  ctx.restore();
}
function drawBricks() {
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const t = performance.now() / 1000;
  for (let i = 0; i < bricks.length; i++) {
    const b = bricks[i];
    const col = tierColor(b.hp);
    const punch = 1 + b.punch * 0.08;
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.rotate(b.ang);
    ctx.scale(punch, punch);
    const w = CELL - GAP, h = BRICK_H;
    ctx.fillStyle = col[1];
    roundRect(-w / 2, -h / 2 + 3, w, h, 7); ctx.fill();
    const g = ctx.createLinearGradient(0, -h / 2, 0, h / 2);
    g.addColorStop(0, col[0]);
    g.addColorStop(1, shade(col[0], -0.18));
    ctx.fillStyle = g;
    roundRect(-w / 2, -h / 2, w, h - 2, 7); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.22)';
    roundRect(-w / 2 + 3, -h / 2 + 2, w - 6, h * 0.32, 5); ctx.fill();
    if (b.flash > 0) {
      ctx.fillStyle = 'rgba(255,255,255,' + (b.flash * 0.75) + ')';
      roundRect(-w / 2, -h / 2, w, h - 2, 7); ctx.fill();
    }
    if (i === 0) {           // 蛇头：发光 + 眼睛
      ctx.shadowColor = 'rgba(255,255,255,0.8)';
      ctx.shadowBlur = 8 + 5 * Math.sin(t * 6);
      ctx.fillStyle = 'rgba(255,255,255,0.95)';
      ctx.beginPath();
      ctx.arc(-w * 0.18, -h * 0.28, 2.2, 0, TAU);
      ctx.arc(w * 0.18, -h * 0.28, 2.2, 0, TAU);
      ctx.fill();
      ctx.shadowBlur = 0;
    }
    ctx.fillStyle = '#fff';
    const fs = Math.round(h * 0.52 * (1 + b.punch * 0.35));
    ctx.font = '800 ' + fs + 'px system-ui, "PingFang SC", sans-serif';
    ctx.shadowColor = 'rgba(0,0,0,0.4)'; ctx.shadowBlur = 4; ctx.shadowOffsetY = 1;
    ctx.fillText(String(b.hp), 0, -1);
    ctx.restore();
  }
  ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
}
function drawPowerups() {
  const t = performance.now() / 1000;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const p of powerups) {
    const def = POWER_TYPES[p.type];
    const w = CELL * 0.78, h = CELL * 0.4;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(Math.sin(t * 4 + p.x) * 0.16);
    ctx.shadowColor = def.color; ctx.shadowBlur = 10;
    ctx.fillStyle = def.color;
    roundRect(-w / 2, -h / 2, w, h, h / 2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    roundRect(-w / 2 + 3, -h / 2 + 2, w - 6, h * 0.4, h / 3); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = '900 ' + Math.round(h * 0.62) + 'px system-ui, "PingFang SC", sans-serif';
    ctx.fillText(def.label, 0, 0);
    ctx.restore();
  }
}
function drawLasers() {
  if (!lasers.length) return;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const l of lasers) {
    const g = ctx.createLinearGradient(l.x, l.y, l.x, l.y + 30);
    g.addColorStop(0, 'rgba(180,225,255,0.95)');
    g.addColorStop(1, 'rgba(77,171,247,0)');
    ctx.fillStyle = g;
    ctx.fillRect(l.x - 2, l.y - 30, 4, 30);
  }
  ctx.restore();
}
function drawMeteors() {
  for (const m of meteors) {
    const g = ctx.createRadialGradient(m.x, m.y, 1, m.x, m.y, 12);
    g.addColorStop(0, '#fff');
    g.addColorStop(0.4, '#da77f2');
    g.addColorStop(1, 'rgba(218,119,242,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(m.x, m.y, 12, 0, TAU); ctx.fill();
  }
}
function drawBolts() {
  if (!bolts.length) return;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const b of bolts) {
    const a = 1 - b.age / b.life;
    ctx.strokeStyle = 'rgba(255,240,150,' + a + ')';
    ctx.lineWidth = 3;
    ctx.shadowColor = 'rgba(255,240,150,0.9)';
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.moveTo(b.pts[0].x, b.pts[0].y);
    for (let i = 1; i < b.pts.length; i++) ctx.lineTo(b.pts[i].x, b.pts[i].y);
    ctx.stroke();
  }
  ctx.restore();
  ctx.shadowBlur = 0;
}
function drawPaddle() {
  if (state === S_MENU) return;
  const w = paddleW(), h = 14;
  const squash = 1 - paddlePunch * 0.3;
  ctx.save();
  ctx.translate(paddleX, paddleY + h / 2);
  ctx.scale(1 + paddlePunch * 0.12, squash);
  if (laserT > 0) { ctx.shadowColor = 'rgba(77,171,247,0.8)'; ctx.shadowBlur = 14; }
  const g = ctx.createLinearGradient(0, -h / 2, 0, h / 2);
  g.addColorStop(0, '#a5c8ff');
  g.addColorStop(0.5, laserT > 0 ? '#4dabf7' : '#4c6ef5');
  g.addColorStop(1, '#364fc7');
  ctx.fillStyle = g;
  roundRect(-w / 2, -h / 2, w, h, h / 2); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  roundRect(-w / 2 + 5, -h / 2 + 2, w - 10, 4, 2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.beginPath(); ctx.arc(0, 0, 2.5, 0, TAU); ctx.fill();
  ctx.restore();
  if (fireT > 0) {
    ctx.fillStyle = 'rgba(255,107,107,0.9)';
    ctx.font = '700 14px system-ui, "PingFang SC", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('🔥 火球穿透 ' + Math.ceil(fireT) + 's', paddleX, paddleY + 26);
  }
  const tags = [];
  if (laserT > 0) tags.push('⚡ 激光 ' + Math.ceil(laserT) + 's');
  if (thunderT > 0) tags.push('🌩 天雷 ' + Math.ceil(thunderT) + 's');
  if (tags.length) {
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.font = '600 12px system-ui, "PingFang SC", sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText(tags.join(' · '), W - 16, H - 12);
  }
}
function drawBalls() {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const b of balls) {
    for (let i = 1; i < b.trail.length; i++) {
      const a = i / b.trail.length;
      ctx.strokeStyle = fireT > 0
        ? 'rgba(255,146,43,' + (a * 0.5) + ')'
        : 'rgba(120,180,255,' + (a * 0.35) + ')';
      ctx.lineWidth = BALL_R * 1.8 * a;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(b.trail[i - 1].x, b.trail[i - 1].y);
      ctx.lineTo(b.trail[i].x, b.trail[i].y);
      ctx.stroke();
    }
  }
  ctx.restore();
  for (const b of balls) {
    const g = ctx.createRadialGradient(b.x - BALL_R * 0.3, b.y - BALL_R * 0.3, BALL_R * 0.2, b.x, b.y, BALL_R * (fireT > 0 ? 1.5 : 1));
    if (fireT > 0) { g.addColorStop(0, '#fff'); g.addColorStop(0.5, '#ff922b'); g.addColorStop(1, 'rgba(255,107,107,0)'); }
    else { g.addColorStop(0, '#fff'); g.addColorStop(1, '#74c0fc'); }
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(b.x, b.y, BALL_R * (fireT > 0 ? 1.5 : 1), 0, TAU); ctx.fill();
  }
  const stuck = balls.find(b => b.stuck);
  if (stuck && state === S_PLAY && introT >= 1) {
    const a = 0.4 + 0.25 * Math.sin(performance.now() / 240);
    ctx.strokeStyle = 'rgba(255,255,255,' + (a * 0.5) + ')';
    ctx.lineWidth = 2; ctx.setLineDash([4, 6]);
    ctx.beginPath(); ctx.moveTo(stuck.x, stuck.y - BALL_R - 4); ctx.lineTo(stuck.x, stuck.y - 70); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(255,255,255,' + a + ')';
    ctx.font = '600 14px system-ui, "PingFang SC", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('点击 / 空格 发射', stuck.x, stuck.y - 82);
  }
}
function drawParticles() {
  for (const p of particles) {
    const a = Math.max(0, 1 - p.age / p.life);
    if (p.type === 'spark') {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = a;
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.w, 0, TAU); ctx.fill();
      ctx.restore();
    } else {
      ctx.save();
      ctx.globalAlpha = a;
      ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    }
  }
  ctx.globalAlpha = 1;
}
function drawPopups() {
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const p of popups) {
    const a = 1 - p.age / p.life;
    const punch = 1 + 0.5 * Math.max(0, 1 - p.age * 7);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.translate(p.x, p.y);
    ctx.scale(punch, punch);
    ctx.fillStyle = p.color;
    ctx.font = '800 ' + p.size + 'px system-ui, "PingFang SC", sans-serif';
    ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 6;
    ctx.fillText(p.text, 0, 0);
    ctx.restore();
  }
  ctx.globalAlpha = 1; ctx.shadowBlur = 0;
}
function drawHUD() {
  if (state === S_MENU) return;
  ctx.save();
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.font = '600 13px system-ui, "PingFang SC", sans-serif';
  ctx.fillText('得分', 18, 22);
  ctx.fillStyle = '#fff';
  ctx.font = '900 26px system-ui, "PingFang SC", sans-serif';
  ctx.fillText(String(score), 18, 48);
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.font = '600 13px system-ui, "PingFang SC", sans-serif';
  ctx.fillText('第 ' + level + ' 关 · 蛇鳞 ×' + bricks.length, W / 2, 22);
  ctx.textAlign = 'right';
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.font = '600 13px system-ui, "PingFang SC", sans-serif';
  ctx.fillText('生命', W - 18, 22);
  let hearts = '';
  for (let i = 0; i < 3; i++) hearts += i < lives ? '❤' : '♡';
  ctx.fillStyle = '#ff6b6b';
  ctx.font = '700 20px system-ui, "PingFang SC", sans-serif';
  ctx.fillText(hearts, W - 18, 48);
  ctx.restore();
}
function roundRect(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const r = Math.max(0, Math.min(255, Math.round(((n >> 16) & 255) * (1 + amt))));
  const g = Math.max(0, Math.min(255, Math.round(((n >> 8) & 255) * (1 + amt))));
  const b = Math.max(0, Math.min(255, Math.round((n & 255) * (1 + amt))));
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}

/* ---------- 主循环 ---------- */
let lastT = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  let rdt = (now - lastT) / 1000;
  lastT = now;
  rdt = Math.min(rdt, 0.05);
  if (!paused) update(rdt);
  render();
}
requestAnimationFrame(frame);

/* ---------- UI ---------- */
const OVS = ['menuOv', 'levelsOv', 'clearOv', 'overOv', 'pauseOv'];
function hideAll() { OVS.forEach(id => document.getElementById(id).classList.add('hidden')); }
function show(id) { hideAll(); document.getElementById(id).classList.remove('hidden'); }
function refreshMenu() {
  document.getElementById('btnContinue').textContent = '开始挑战 · 第 ' + Math.min(progress.unlocked, MAX_LEVEL) + ' 关';
  document.getElementById('btnMute').textContent = muted ? '🔇 音效：关' : '🔊 音效：开';
}
function buildLevelGrid() {
  const grid = document.getElementById('levelGrid');
  grid.innerHTML = '';
  for (let i = 1; i <= MAX_LEVEL; i++) {
    const btn = document.createElement('button');
    const locked = i > progress.unlocked;
    btn.className = 'lvBtn' + (locked ? ' locked' : '');
    if (locked) {
      btn.textContent = '🔒';
    } else {
      const st = progress.stars[i] || 0;
      btn.innerHTML = String(i) + '<span class="st">' + (st ? '★★★'.slice(0, st) : '· · ·') + '</span>';
      btn.addEventListener('click', () => { ensureAudio(); startLevel(i); });
    }
    grid.appendChild(btn);
  }
}
document.getElementById('btnContinue').addEventListener('click', () => { ensureAudio(); startLevel(progress.unlocked); });
document.getElementById('btnLevels').addEventListener('click', () => { buildLevelGrid(); show('levelsOv'); });
document.getElementById('btnBackMenu').addEventListener('click', () => { state = S_MENU; refreshMenu(); show('menuOv'); });
document.getElementById('btnMute').addEventListener('click', () => {
  muted = !muted;
  try { localStorage.setItem('brickBlaster.muted', muted ? '1' : '0'); } catch (e) {}
  refreshMenu();
  if (!muted) { ensureAudio(); blip(660, 0.08, 'triangle', 0.15); }
});
document.getElementById('btnNext').addEventListener('click', () => startLevel(level + 1));
document.getElementById('btnReplay').addEventListener('click', () => startLevel(level));
document.getElementById('btnRetry').addEventListener('click', () => startLevel(level));
document.getElementById('btnToLevels').addEventListener('click', () => { buildLevelGrid(); show('levelsOv'); });
document.getElementById('btnToLevels2').addEventListener('click', () => { state = S_MENU; buildLevelGrid(); show('levelsOv'); });
document.getElementById('btnResume').addEventListener('click', () => { paused = false; hideAll(); });
document.getElementById('btnQuit').addEventListener('click', () => { paused = false; state = S_MENU; refreshMenu(); show('menuOv'); });
document.addEventListener('visibilitychange', () => {
  if (document.hidden && state === S_PLAY && !paused) { paused = true; show('pauseOv'); }
});

/* 调试接口（自动化测试用） */
window.__bb = {
  startLevel,
  launch,
  paddleTo: px => { paddleTarget = px; },
  split: () => splitBalls(),
  buff: t => {
    if (t === 'fire') fireT = 8;
    else if (t === 'laser') { laserT = 6; laserCd = 0; }
    else if (t === 'thunder') thunderT = 8;
    else if (t === 'meteor') rainMeteors();
  },
  weaken: () => { bricks.forEach(b => { b.hp = 1; }); },
  nuke: () => { bricks.slice().forEach(b => shatterSegment(b, true)); },
  dropAllButOne: () => {
    const keep = balls.find(b => !b.stuck);
    balls = keep ? [keep] : balls.slice(0, 1);
  },
  get state() { return state; },
  get level() { return level; },
  get score() { return score; },
  get lives() { return lives; },
  get ballsCount() { return balls.length; },
  get brickCount() { return bricks.length; },
  get paddleX() { return paddleX; },
  get firstBallX() { const b = balls.find(x => !x.stuck); return b ? b.x : null; },
  get snakeHead() { return { x: Math.round(head.x), y: Math.round(head.y) }; },
  get powerupCount() { return powerups.length; }
};
refreshMenu();
show('menuOv');
</script>
